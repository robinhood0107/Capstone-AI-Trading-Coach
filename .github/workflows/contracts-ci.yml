name: Contracts CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  contracts:
    name: Contract schema validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: "0.11.26"
          python-version: "3.12"

      - name: Check generated contract artifacts
        run: uv run --frozen python contracts/generate_principle_contracts.py --check

      - name: Check generated S2.2 contract artifacts
        run: uv run --frozen python contracts/generate_s2_2_contracts.py --check

      - name: Check generated S2.3 contract artifacts
        run: uv run --frozen python contracts/generate_s2_3_contracts.py --check

      - name: Check generated S3.2 contract artifacts
        run: uv run --frozen python contracts/generate_s3_2_contracts.py --check

      - name: Check generated S3.3 contract artifacts
        run: uv run --frozen python contracts/generate_s3_3_contracts.py --check

      - name: Check generated S4 RAG contract artifacts
        run: uv run --frozen python contracts/generate_s4_rag_contracts.py --check

      - name: Check generated S4.7B source-card v2 artifacts
        run: uv run --frozen python contracts/generate_rag_source_card_v2_contracts.py --check

      - name: Check generated S4.7C external-processing corpus artifacts
        run: uv run --frozen python capstone-rag/generate_s4_7c_external_corpus.py --check

      - name: Check generated S4.7D RAG v2 contract artifacts
        run: uv run --frozen python contracts/generate_s4_7d_rag_v2_contracts.py --check

      - name: Check generated S4.5 evaluation artifacts
        run: uv run --frozen python capstone-rag/generate_s4_5_evaluation.py --check

      - name: Check generated S4.5 provider approval contracts
        run: uv run --frozen python contracts/generate_s4_5_provider_contracts.py --check

      - name: Check generated S1.3G news aggregate contract artifacts
        run: uv run --frozen python contracts/generate_s1_3g_news_contracts.py --check

      - name: Check generated S4.8A cross-market contract artifacts
        run: uv run --frozen python contracts/generate_s4_8a_cross_market_contracts.py --check

      - name: Check generated S4.6 RAG proto artifacts
        run: >-
          uv run --project workspaces/decision-platform/python-services --frozen
          python contracts/generate_rag_proto.py --check

      - name: Check generated S4.7D RAG v2 proto artifacts
        run: >-
          uv run --project workspaces/decision-platform/python-services --frozen
          python contracts/generate_rag_v2_proto.py --check

      - name: Check generated S5.0 Signal v2 contract artifacts
        run: uv run --frozen python contracts/generate_s5_0_signal_v2_contracts.py --check

      - name: Run contract tooling tests
        run: uv run --frozen python -m unittest discover -s contracts/tests -v

      - name: Verify Pre-S5 document truth freeze
        run: uv run --frozen python contracts/verify_pre_s5_doc_truth_freeze.py --check

      - name: Validate all contract examples
        run: uv run --frozen python contracts/validate.py

  openapi-drift:
    name: Spring OpenAPI drift
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Set up JDK 25
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Install uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: "0.11.26"
          python-version: "3.12"

      - name: Create isolated OpenAPI fixture environment
        run: workspaces/decision-platform/spring-api/gradlew -p workspaces/decision-platform/spring-api prepareOpenApiFixtureEnv

      - name: Generate and compare Spring OpenAPI
        run: >-
          uv run --frozen python contracts/run_openapi_gate.py
          --env-file workspaces/decision-platform/spring-api/build/openapi-fixture/openapi.env
