name: Kotlin Build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  kotlin-build:
    name: Kotlin ktlint and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: workspaces/decision-platform/spring-api

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Set up JDK 25
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Run ktlint and build
        run: ./gradlew ktlintCheck build
