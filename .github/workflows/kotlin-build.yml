name: Kotlin Build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  kotlin-build:
    name: Kotlin ktlint and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: workspaces/decision-platform/spring-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run ktlint and build
        run: ./gradlew ktlintCheck build
