name: Lint & Static Analysis

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-static-analysis:
    name: Lint & Static Analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Java 25
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v5.2.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v7.2.1
        with:
          version: 0.11.26
          python-version: "3.12"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v5.0.2

      - name: Install pinned Python linters
        shell: bash
        run: |
          set -Eeuo pipefail
          uv tool install yamllint==1.38.0
          uv tool install toml-sort==0.24.4
          uv tool install pymarkdownlnt==0.9.39
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"

      - name: Install checksum-pinned native linters
        shell: bash
        env:
          SHELLCHECK_SHA256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
        run: |
          set -Eeuo pipefail
          tool_root="$RUNNER_TEMP/p1-lint-tools"
          install -d -m 0755 "$tool_root/bin" "$tool_root/downloads"
          curl --fail --location --output "$tool_root/downloads/shellcheck.tar.gz" \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.gz
          curl --fail --location --output "$tool_root/downloads/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          curl --fail --location --output "$tool_root/downloads/hadolint" \
            https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64
          echo "$SHELLCHECK_SHA256  $tool_root/downloads/shellcheck.tar.gz" | sha256sum -c -
          echo "$ACTIONLINT_SHA256  $tool_root/downloads/actionlint.tar.gz" | sha256sum -c -
          echo "$HADOLINT_SHA256  $tool_root/downloads/hadolint" | sha256sum -c -
          tar -xzf "$tool_root/downloads/shellcheck.tar.gz" -C "$tool_root/downloads"
          tar -xzf "$tool_root/downloads/actionlint.tar.gz" -C "$tool_root/bin"
          install -m 0755 "$tool_root/downloads/shellcheck-v0.11.0/shellcheck" "$tool_root/bin/shellcheck"
          install -m 0755 "$tool_root/downloads/hadolint" "$tool_root/bin/hadolint"
          echo "$tool_root/bin" >> "$GITHUB_PATH"

      - name: Sync locked Python tooling
        run: uv sync --project workspaces/decision-platform/python-services --frozen

      - name: Run check-only lint and static analysis
        run: bash scripts/lint-static-analysis.sh
