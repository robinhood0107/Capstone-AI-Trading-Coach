name: MARS FULL Docker Hub release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions: {}

concurrency:
  group: mars-full-dockerhub-release
  cancel-in-progress: false

jobs:
  classify-full-merge:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
      full_image_required: ${{ steps.impact.outputs.full_image_required }}
      full_publish_noop: ${{ steps.impact.outputs.full_publish_noop }}
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
      service_ready: ${{ steps.identity.outputs.service_ready }}
    steps:
      - name: Checkout exact merged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Classify paths before any FULL image decision
        id: impact
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          [[ "$MERGE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ $(git rev-parse HEAD) == "$MERGE_SHA" ]]
          [[ $(git rev-parse HEAD^2) == "$SOURCE_SHA" ]]
          git cat-file -e "$MERGE_SHA^{commit}"
          [[ $(git status --porcelain --untracked-files=all) == '' ]]
          git diff --name-only HEAD^1 HEAD^2 > changed-paths.txt
          python3 deploy/p1/classify_product_changes.py --paths-file changed-paths.txt --format github
      - name: Verify FULL release gate and promotion checks
        id: identity
        if: steps.impact.outputs.full_image_required == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -Eeuo pipefail
          [[ $(git rev-parse HEAD) == "$MERGE_SHA" ]]
          git cat-file -e "$MERGE_SHA^{commit}"
          [[ $(jq -r '.imagePublicationReady' deploy/p1/mars-release-gate.json) == true ]]
          version=$(jq -r '.version' deploy/p1/mars-release-gate.json)
          service_ready=$(jq -r '.serviceReady' deploy/p1/mars-release-gate.json)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$service_ready" == true || "$service_ready" == false ]]
          checks=$(gh pr view "$PR_NUMBER" --json statusCheckRollup --jq '.statusCheckRollup[] | [.name // .context, .conclusion // .state] | @tsv')
          required=(
            'Product Impact Classification'
            'Repo hygiene'
            'Kotlin ktlint and build'
            'Python quality gates'
            'Contract schema validation'
            'Spring OpenAPI drift'
            'Lint & Static Analysis'
            'P1 full-app security gates'
            'MARS product image build'
          )
          for check in "${required[@]}"; do
            printf '%s\n' "$checks" | awk -F '\t' -v name="$check" '$1==name && $2=="SUCCESS" {ok=1} END {exit !ok}'
          done
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "MARS_RELEASE_VERSION_NOT_BUMPED: $tag already exists" >&2
            exit 1
          fi
          {
            echo "sha=$MERGE_SHA"
            echo "version=$version"
            echo "tag=$tag"
            echo "service_ready=$service_ready"
          } >> "$GITHUB_OUTPUT"
      - name: Record FULL publish no-op for DEMO-only or deployment-only changes
        if: steps.impact.outputs.full_image_required != 'true'
        run: |
          echo 'FULL_PUBLISH_NOOP=true — no FULL image, FULL version bump, Portainer release asset, or Docker Hub tag was created.' >> "$GITHUB_STEP_SUMMARY"

  build-scan-push-full:
    needs: classify-full-merge
    if: needs.classify-full-merge.outputs.full_image_required == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      sha: ${{ needs.classify-full-merge.outputs.sha }}
      version: ${{ needs.classify-full-merge.outputs.version }}
      tag: ${{ needs.classify-full-merge.outputs.tag }}
      service_ready: ${{ needs.classify-full-merge.outputs.service_ready }}
    steps:
      - name: Checkout exact FULL source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.classify-full-merge.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build FULL API and shared infrastructure from one SHA
        env:
          SHA: ${{ needs.classify-full-merge.outputs.sha }}
          VERSION: ${{ needs.classify-full-merge.outputs.version }}
        run: |
          set -Eeuo pipefail
          for part in api postgres redis; do
            case "$part" in
              api) file=deploy/p1/docker/decision-platform.Dockerfile ;;
              postgres) file=deploy/p1/docker/postgres-pgvector.Dockerfile ;;
              redis) file=deploy/p1/docker/redis.Dockerfile ;;
            esac
            docker buildx build --platform linux/amd64 --load \
              --file "$file" \
              --build-arg SOURCE_REVISION="$SHA" --build-arg RELEASE_VERSION="$VERSION" \
              --tag "mars-full-build:$part" .
            [[ $(docker image inspect "mars-full-build:$part" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}') == "$SHA" ]]
          done
      - name: Build FULL dashboard from the FULL entrypoint
        env:
          SHA: ${{ needs.classify-full-merge.outputs.sha }}
          VERSION: ${{ needs.classify-full-merge.outputs.version }}
        run: |
          set -Eeuo pipefail
          docker buildx build --platform linux/amd64 --load \
            --file workspaces/experience-dashboard/Dockerfile \
            --build-arg MARS_PRODUCT=full \
            --build-arg SOURCE_REVISION="$SHA" --build-arg RELEASE_VERSION="$VERSION" \
            --tag mars-full-build:web workspaces/experience-dashboard
          [[ $(docker image inspect mars-full-build:web --format '{{index .Config.Labels "org.opencontainers.image.revision"}}') == "$SHA" ]]
          [[ $(docker image inspect mars-full-build:web --format '{{index .Config.Env}}') == *"NEXT_PUBLIC_MARS_PRODUCT=full"* ]]
      - name: Scan FULL API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: mars-full-build:api
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan FULL PostgreSQL image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: mars-full-build:postgres
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan FULL Redis image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: mars-full-build:redis
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan FULL web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: mars-full-build:web
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Prepare FULL release asset directory
        run: mkdir -p release-assets
      - name: Generate FULL API SBOM
        uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          image: mars-full-build:api
          format: spdx-json
          output-file: release-assets/mars-api.spdx.json
          upload-artifact: false
      - name: Install Syft and generate FULL infrastructure and web SBOMs
        uses: anchore/sbom-action/download-syft@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
      - name: Generate remaining FULL SBOMs
        run: |
          set -Eeuo pipefail
          for part in postgres redis web; do
            syft "docker:mars-full-build:$part" -o spdx-json="release-assets/mars-${part}.spdx.json"
          done
      - name: Login to Docker Hub after FULL scans
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          username: pjjpjj111
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish only the FULL image set and verify digests
        env:
          SHA: ${{ needs.classify-full-merge.outputs.sha }}
          TAG: ${{ needs.classify-full-merge.outputs.tag }}
        run: |
          set -Eeuo pipefail
          mkdir -p release-assets
          printf '%s\n' "$SHA" "$TAG" > /tmp/mars-full-identity.txt
          : > /tmp/mars-full-images.tsv
          for part in api web postgres redis; do
            repo=pjjpjj111/mars-full
            ref="$repo:$TAG-$part"
            local_ref="mars-full-build:$part"
            local_id=$(docker image inspect "$local_ref" --format '{{.Id}}')
            if docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
              docker pull --platform linux/amd64 "$ref"
              [[ $(docker image inspect "$ref" --format '{{.Id}}') == "$local_id" ]]
            else
              docker tag "$local_ref" "$ref"
              docker push "$ref"
            fi
            digest="sha256:$(docker buildx imagetools inspect "$ref" --raw | sha256sum | awk '{print $1}')"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            docker pull --platform linux/amd64 "$repo@$digest"
            [[ $(docker image inspect "$repo@$digest" --format '{{.Id}}') == "$local_id" ]]
            [[ $(docker image inspect "$repo@$digest" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}') == "$SHA" ]]
            printf '%s\t%s\t%s\n' "$part" "$ref" "$digest" >> /tmp/mars-full-images.tsv
          done
          python3 - "$SHA" "$TAG" /tmp/mars-full-images.tsv <<'PY' > release-assets/mars-images.json
          import json, sys
          sha, tag, path = sys.argv[1:]
          images = {}
          for line in open(path, encoding="utf-8"):
              part, reference, digest = line.rstrip("\n").split("\t")
              images[f"full-{part}"] = {"reference": reference, "digest": digest}
          assert set(images) == {"full-api", "full-web", "full-postgres", "full-redis"}
          print(json.dumps({"product": "full", "sourceSha": sha, "tag": tag, "images": images}, sort_keys=True, indent=2))
          PY
          python3 deploy/p1/render_mars_release_compose.py \
            --product full --images release-assets/mars-images.json \
            --output release-assets/mars-public-full.compose.yml
          python3 -m json.tool release-assets/mars-images.json >/dev/null
          if grep -E '^[[:space:]]*image:' release-assets/mars-public-full.compose.yml | grep -v '@sha256:'; then
            echo "FULL manifest contains an unpinned image reference." >&2
            exit 1
          fi
          if grep -E 'mars-demo|demo-state|session-signing-key' release-assets/mars-public-full.compose.yml; then
            echo "FULL manifest contains a DEMO resource reference." >&2
            exit 1
          fi
      - name: Upload FULL-only release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mars-full-release-assets-${{ needs.classify-full-merge.outputs.tag }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  publish-full-release:
    needs: [classify-full-merge, build-scan-push-full]
    if: >-
      needs.classify-full-merge.outputs.full_image_required == 'true' &&
      needs.build-scan-push-full.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      checks: read
      contents: write
      pull-requests: read
    steps:
      - name: Checkout exact FULL merge source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.classify-full-merge.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download FULL-only release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mars-full-release-assets-${{ needs.classify-full-merge.outputs.tag }}
          path: release-assets
      - name: Recheck FULL identity, checks and independent manifest
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.classify-full-merge.outputs.sha }}
          TAG: ${{ needs.classify-full-merge.outputs.tag }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -Eeuo pipefail
          [[ $(git rev-parse HEAD) == "$SHA" ]]
          git cat-file -e "$SHA^{commit}"
          [[ $(git rev-parse HEAD^2) == "${{ github.event.pull_request.head.sha }}" ]]
          [[ $(jq -r '.imagePublicationReady' deploy/p1/mars-release-gate.json) == true ]]
          [[ "v$(jq -r '.version' deploy/p1/mars-release-gate.json)" == "$TAG" ]]
          [[ $(jq -r '.sourceSha' release-assets/mars-images.json) == "$SHA" ]]
          [[ $(jq -r '.product' release-assets/mars-images.json) == "full" ]]
          [[ $(jq -r '.images | keys | sort | join(",")' release-assets/mars-images.json) == "full-api,full-postgres,full-redis,full-web" ]]
          checks=$(gh pr view "$PR_NUMBER" --json statusCheckRollup --jq '.statusCheckRollup[] | [.name // .context, .conclusion // .state] | @tsv')
          for check in 'Product Impact Classification' 'Repo hygiene' 'Kotlin ktlint and build' 'Python quality gates' \
                       'Contract schema validation' 'Spring OpenAPI drift' 'Lint & Static Analysis' \
                       'P1 full-app security gates' 'MARS product image build'; do
            printf '%s\n' "$checks" | awk -F '\t' -v name="$check" '$1==name && $2=="SUCCESS" {ok=1} END {exit !ok}'
          done
          for asset in mars-images.json mars-public-full.compose.yml mars-api.spdx.json mars-postgres.spdx.json mars-redis.spdx.json mars-web.spdx.json; do
            [[ -s "release-assets/$asset" ]]
          done
          if grep -E 'mars-demo|demo-state|session-signing-key' release-assets/mars-public-full.compose.yml; then
            echo "FULL manifest contains a DEMO resource reference." >&2
            exit 1
          fi
      - name: Publish immutable FULL release and read back its assets
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.classify-full-merge.outputs.sha }}
          TAG: ${{ needs.classify-full-merge.outputs.tag }}
          SERVICE_READY: ${{ needs.classify-full-merge.outputs.service_ready }}
        run: |
          set -Eeuo pipefail
          notes=$(mktemp /tmp/mars-full-release-notes.XXXXXX)
          trap 'rm -f -- "$notes"' EXIT
          cat > "$notes" <<EOF
          Merged FULL source: $SHA

          This release contains only pjjpjj111/mars-full images, the FULL digest manifest, FULL Compose and FULL SBOMs.
          Service readiness: $SERVICE_READY. No NAS deployment or N-user capacity test is included.
          The independent DEMO sync workflow is not a dependency of this FULL release.
          EOF
          gh release create "$TAG" --target "$SHA" --title "MARS FULL $TAG" --notes-file "$notes" \
            release-assets/mars-images.json \
            release-assets/mars-public-full.compose.yml \
            release-assets/mars-api.spdx.json \
            release-assets/mars-postgres.spdx.json \
            release-assets/mars-redis.spdx.json \
            release-assets/mars-web.spdx.json
          mkdir -p release-readback
          gh release download "$TAG" --dir release-readback
          for asset in mars-images.json mars-public-full.compose.yml mars-api.spdx.json mars-postgres.spdx.json mars-redis.spdx.json mars-web.spdx.json; do
            cmp "release-assets/$asset" "release-readback/$asset"
          done
