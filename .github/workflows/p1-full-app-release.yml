name: P1 full-app 1.0.0 release

on:
  workflow_dispatch:
    inputs:
      expectedMergeSha:
        description: Exact merge commit currently at main HEAD
        required: true
        type: string
      releaseVersion:
        description: Must be 1.0.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: p1-full-app-1-0-0-release
  cancel-in-progress: false

jobs:
  contract-preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact merge source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.expectedMergeSha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate immutable release identity
        shell: bash
        env:
          EXPECTED_MERGE_SHA: ${{ inputs.expectedMergeSha }}
          RELEASE_VERSION: ${{ inputs.releaseVersion }}
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_VERSION" == '1.0.0' ]]
          [[ "$EXPECTED_MERGE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ $(git rev-parse HEAD) == "$EXPECTED_MERGE_SHA" ]]
          [[ $(git status --porcelain --untracked-files=all) == '' ]]
          [[ $(git ls-remote origin refs/heads/main | cut -f1) == "$EXPECTED_MERGE_SHA" ]]

      - name: Set up uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          enable-cache: true

      - name: Validate full-app v2 contract and documentation gates
        run: >-
          uv run --frozen python -m unittest
          contracts.tests.test_p1_full_app_asset_verifier
          contracts.tests.test_p1_full_app_release_contract_v2
          contracts.tests.test_p1_full_app_documentation -v

      - name: Fail closed until build and final-manifest jobs are implemented
        shell: bash
        run: |
          echo 'P1_FULL_APP_RELEASE_WORKFLOW=CONTRACT_PREFLIGHT_ONLY' >&2
          echo 'P1_FULL_APP_RELEASE=BLOCKED_IMPLEMENTATION_INCOMPLETE' >&2
          exit 1
