name: P1 full-app security

on:
  pull_request:
    paths:
      - ".github/workflows/p1-full-app-security.yml"
      - "deploy/p1/**"
      - "workspaces/decision-platform/**"
      - "workspaces/experience-dashboard/**"
      - "workspaces/return-engine/**"
      - "contracts/**"
      - "README.md"
      - "capstone"
      - "capstone.ps1"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: p1-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security-gates:
    name: P1 full-app security gates
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # 비밀 스캔이 base..head 범위를 읽는다. 기본값 1 이면 PR 에서 base SHA 가 없어
          # 범위가 풀리지 않고, gitleaks 는 그 경우 0개 커밋을 검사한 뒤 성공으로 끝난다.
          fetch-depth: 0
          persist-credentials: false

      - name: Secret scan
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -Eeuo pipefail
          tool_root="${RUNNER_TEMP}/gitleaks-${GITLEAKS_VERSION}"
          mkdir -p "$tool_root"
          archive="$tool_root/gitleaks.tar.gz"
          curl --fail --location --retry 3 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_LINUX_X64_SHA256  $archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$tool_root" gitleaks
          test "$("$tool_root/gitleaks" version)" = "$GITLEAKS_VERSION"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            log_range="${PR_BASE_SHA}..${GITHUB_SHA}"
          elif [[ "$PUSH_BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] && \
               [[ "$PUSH_BEFORE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            log_range="${PUSH_BEFORE_SHA}..${GITHUB_SHA}"
          else
            log_range="$GITHUB_SHA"
          fi
          # gitleaks 는 범위가 풀리지 않으면 ERR 만 찍고 0 으로 끝난다(8.30.1 실측). 그러면
          # 검사한 커밋이 0개인데 게이트는 통과한다. 스캔 전에 범위를 직접 확인해 그 경우를 닫는다.
          if ! git rev-list --quiet "$log_range" -- >/dev/null 2>&1; then
            echo "SECRET_SCAN_RANGE_UNRESOLVABLE range=$log_range" >&2
            exit 1
          fi
          echo "SECRET_SCAN_COMMITS=$(git rev-list --count "$log_range" --)"
          "$tool_root/gitleaks" detect --source . --config .gitleaks.toml --redact \
            --exit-code 1 --no-banner --log-opts="$log_range"

      - name: Build production images
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -Eeuo pipefail
          docker build -f deploy/p1/docker/decision-platform.Dockerfile -t capstone-decision-platform:security .
          docker build -f workspaces/experience-dashboard/Dockerfile -t capstone-experience-dashboard:security workspaces/experience-dashboard
          docker build -f workspaces/return-engine/Dockerfile -t capstone-return-engine:security workspaces/return-engine

      - name: Filesystem dependency scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Decision Platform image scan
        if: github.event_name == 'push'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: capstone-decision-platform:security
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Dashboard image scan
        if: github.event_name == 'push'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: capstone-experience-dashboard:security
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Return Engine image scan
        if: github.event_name == 'push'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: capstone-return-engine:security
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Record scoped security marker
        run: echo 'CODEX_SECURITY_DEEP_SCAN=NOT_RUN_USER_SCOPED_OUT'
