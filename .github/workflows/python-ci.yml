name: Python CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-quality:
    name: Python quality gates
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: workspaces/decision-platform/python-services

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: "0.11.26"
          python-version: "3.12"

      - name: Check lockfile
        run: uv lock --check

      - name: Sync frozen environment
        run: uv sync --frozen

      - name: Check generated disclosure proto artifacts
        run: uv run --frozen python ../../../contracts/generate_disclosure_proto.py --check

      - name: Check generated brokerage proto artifacts
        run: uv run --frozen python ../../../contracts/generate_brokerage_proto.py --check

      - name: Run Ruff
        run: uv run --frozen ruff check .

      - name: Run mypy
        run: uv run --frozen mypy app

      - name: Run pytest
        run: TMPDIR=/tmp TEMP=/tmp TMP=/tmp uv run --frozen pytest -q
