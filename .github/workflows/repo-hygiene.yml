name: Repo Hygiene

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  repo-hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify required paths
        shell: bash
        run: |
          set -euo pipefail
          required_paths=(
            "AGENTS.md"
            "CLAUDE.md"
            "README.md"
            ".env.example"
            ".gitignore"
            "docs/최종_프로젝트_명세서.md"
            "docs/API_명세서.md"
            "docs/중간보고서_작성용_초기설계.md"
            "docs/선물옵션_모의주문_확장_시나리오.md"
            "docs/선물옵션_모의주문_확장_시나리오_API_명세서.md"
            "contracts/README.md"
            "infra/docker-compose.infra.yml"
            "infra/init/01-extensions.sql"
            "infra/init/02-application-roles.sh"
            "infra/redis-secure-entrypoint.sh"
            "workspaces/decision-platform/README.md"
            "workspaces/return-engine/README.md"
            "workspaces/experience-dashboard/README.md"
          )

          for path in "${required_paths[@]}"; do
            if [[ ! -e "$path" ]]; then
              echo "Missing required path: $path" >&2
              exit 1
            fi
          done

      - name: Validate compose file
        shell: bash
        env:
          POSTGRES_ADMIN_PASSWORD: validation-dummy-admin
          POSTGRES_APP_PASSWORD: validation-dummy-app
          POSTGRES_MIGRATION_PASSWORD: validation-dummy-migration
          POSTGRES_COLLECTOR_PASSWORD: validation-dummy-collector
          POSTGRES_DISCLOSURE_READER_PASSWORD: validation-dummy-disclosure-reader
          POSTGRES_MARKET_WRITER_PASSWORD: validation-dummy-market-writer
          POSTGRES_PORTFOLIO_WRITER_PASSWORD: validation-dummy-portfolio-writer
          POSTGRES_RISK_WRITER_PASSWORD: validation-dummy-risk-writer
          POSTGRES_FILL_WRITER_PASSWORD: validation-dummy-fill-writer
          POSTGRES_RAG_WRITER_PASSWORD: validation-dummy-rag-writer
          POSTGRES_RAG_ADMIN_PASSWORD: validation-dummy-rag-admin
          POSTGRES_RAG_QUERY_PASSWORD: validation-dummy-rag-query
          POSTGRES_SIGNAL_WRITER_PASSWORD: validation-dummy-signal-writer
          POSTGRES_SIGNAL_SCHEDULER_PASSWORD: validation-dummy-signal-scheduler
          POSTGRES_SIGNAL_ADMIN_PASSWORD: validation-dummy-signal-admin
          POSTGRES_WORKER_PASSWORD: validation-dummy-worker
          POSTGRES_OUTBOX_PUBLISHER_PASSWORD: validation-dummy-outbox-publisher
          POSTGRES_POISON_RECORDER_PASSWORD: validation-dummy-poison-recorder
          POSTGRES_REPLAY_PASSWORD: validation-dummy-replay
          POSTGRES_IDENTITY_PASSWORD: validation-dummy-identity
          POSTGRES_AUTH_PASSWORD: validation-dummy-auth
          POSTGRES_REPLAY_AUTHORIZER_PASSWORD: validation-dummy-replay-authorizer
          POSTGRES_DEMO_PASSWORD: validation-dummy-demo
          REDIS_PASSWORD: validation-dummy-redis-password-0001
          SEARXNG_SECRET: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          MCP_SEARXNG_AUTH_TOKEN: BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
          KAFKA_UI_USERNAME: validation-admin
          KAFKA_UI_PASSWORD: validation-dummy-kafka-ui
        run: docker compose -f infra/docker-compose.infra.yml config --quiet

      - name: Parse Python project metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import tomllib

          path = Path("workspaces/decision-platform/python-services/pyproject.toml")
          with path.open("rb") as file:
              tomllib.load(file)
          print(f"OK {path}")
          PY

      - name: Verify ignore rules
        shell: bash
        run: |
          set -euo pipefail
          git check-ignore -q .env
          git check-ignore -q .env.local
          git check-ignore -q .env.production
          git check-ignore -q workspaces/decision-platform/.env.test
          git check-ignore -q http-client.private.env.json
          git check-ignore -q workspaces/decision-platform/python-services/tests/fixtures/.env.production
          git check-ignore -q workspaces/decision-platform/python-services/tests/fixtures/http-client.private.env.json
          git check-ignore -q workspaces/decision-platform/python-services/tests/fixtures/validation-dummy.pem
          git check-ignore -q .direnv/env
          git check-ignore -q local.p12
          if git check-ignore -q .env.example; then
            exit 1
          fi
          git check-ignore -q workspaces/return-engine/cache/example.py
          git check-ignore -q workspaces/experience-dashboard/cache/page.tsx
          if git check-ignore -q workspaces/return-engine/src/return_engine.py; then
            exit 1
          fi
          if git check-ignore -q workspaces/experience-dashboard/src/app/page.tsx; then
            exit 1
          fi
          git check-ignore -q artifacts/decision-platform/run-001/result.json

      - name: Secret scan
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          tool_root="${RUNNER_TEMP}/gitleaks-${GITLEAKS_VERSION}"
          mkdir -p "$tool_root"
          archive="$tool_root/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_LINUX_X64_SHA256  $archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$tool_root" gitleaks
          test "$("$tool_root/gitleaks" version)" = "$GITLEAKS_VERSION"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            log_range="${PR_BASE_SHA}..${GITHUB_SHA}"
          elif [[ "$PUSH_BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] && \
               [[ "$PUSH_BEFORE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            log_range="${PUSH_BEFORE_SHA}..${GITHUB_SHA}"
          else
            log_range="$GITHUB_SHA"
          fi
          "$tool_root/gitleaks" detect \
            --source . --config .gitleaks.toml --redact --exit-code 1 \
            --log-opts="$log_range"
