name: S1.4R Research Benchmark

on:
  workflow_dispatch:
    inputs:
      matrix:
        description: "Bounded benchmark matrix"
        required: true
        default: full
        type: choice
        options:
          - full
          - smallest

permissions:
  contents: read

concurrency:
  group: s1-4r-benchmark-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_PYTHON: "3.12"
  JAX_PLATFORMS: cpu
  JAX_ENABLE_X64: "1"
  JAX_ENABLE_COMPILATION_CACHE: "0"
  TMPDIR: /tmp
  TEMP: /tmp
  TMP: /tmp
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  S1_4R_EXECUTION_BOUNDARY: native-linux

jobs:
  bounded-benchmark:
    name: Native Linux bounded evidence
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout full history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: "0.11.26"
          python-version: "3.12"

      - name: Sync frozen research environment
        working-directory: workspaces/decision-platform/research/s1-4r-jax-risk
        run: |
          uv lock --check
          uv sync --frozen --all-groups

      - name: Sync frozen production environment for isolation proof
        working-directory: workspaces/decision-platform/python-services
        run: uv sync --frozen

      - name: Run correctness before timing
        working-directory: workspaces/decision-platform/research/s1-4r-jax-risk
        run: |
          uv run --frozen ruff check .
          uv run --frozen mypy src benchmarks
          uv run --frozen pytest -q

      - name: Validate plan and allocation preflight
        working-directory: workspaces/decision-platform/research/s1-4r-jax-risk
        run: |
          uv run --frozen python benchmarks/run.py dry-run \
            --matrix "${{ inputs.matrix }}"

      - name: Run smallest bounded evidence before full matrix
        if: inputs.matrix == 'full'
        working-directory: workspaces/decision-platform/research/s1-4r-jax-risk
        run: |
          uv run --frozen python benchmarks/run.py run \
            --matrix smallest \
            --output-dir benchmarks/output-smallest

      - name: Validate smallest generated manifest
        if: inputs.matrix == 'full'
        working-directory: workspaces/decision-platform/research/s1-4r-jax-risk
        run: |
          uv run --frozen python benchmarks/run.py validate-manifest \
            benchmarks/output-smallest/benchmark-manifest.json

      - name: Run requested bounded benchmark
        working-directory: workspaces/decision-platform/research/s1-4r-jax-risk
        run: |
          uv run --frozen python benchmarks/run.py run \
            --matrix "${{ inputs.matrix }}" \
            --output-dir "benchmarks/output-${{ inputs.matrix }}"

      - name: Validate requested generated manifest
        working-directory: workspaces/decision-platform/research/s1-4r-jax-risk
        run: |
          uv run --frozen python benchmarks/run.py validate-manifest \
            "benchmarks/output-${{ inputs.matrix }}/benchmark-manifest.json"

      - name: Upload reports, raw samples, wheel, and compressed OCI archive
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: s1-4r-${{ inputs.matrix }}-${{ github.run_id }}
          path: |
            workspaces/decision-platform/research/s1-4r-jax-risk/benchmarks/output-*/benchmark-plan.json
            workspaces/decision-platform/research/s1-4r-jax-risk/benchmarks/output-*/benchmark-manifest.json
            workspaces/decision-platform/research/s1-4r-jax-risk/benchmarks/output-*/raw-samples.json
            workspaces/decision-platform/research/s1-4r-jax-risk/benchmarks/output-*/benchmark-report.md
            workspaces/decision-platform/research/s1-4r-jax-risk/benchmarks/output-*/artifacts/wheel/*.whl
            workspaces/decision-platform/research/s1-4r-jax-risk/benchmarks/output-*/artifacts/*.oci.tar.gz
          if-no-files-found: warn
          retention-days: 30
