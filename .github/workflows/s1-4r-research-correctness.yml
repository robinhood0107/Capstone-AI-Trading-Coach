name: S1.4R Research Correctness

on:
  pull_request:
    paths:
      - "workspaces/decision-platform/research/s1-4r-jax-risk/**"
      - ".github/workflows/s1-4r-research-correctness.yml"
      - ".github/workflows/s1-4r-research-benchmark.yml"

permissions:
  contents: read

concurrency:
  group: s1-4r-correctness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON: "3.12"
  JAX_PLATFORMS: cpu
  JAX_ENABLE_X64: "1"
  TMPDIR: /tmp
  TEMP: /tmp
  TMP: /tmp
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  native-correctness:
    name: Native Linux CPU x64 correctness
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout full history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: "0.11.26"
          python-version: "3.12"

      - name: Check research lock
        working-directory: workspaces/decision-platform/research/s1-4r-jax-risk
        run: uv lock --check

      - name: Sync frozen research environment
        working-directory: workspaces/decision-platform/research/s1-4r-jax-risk
        run: uv sync --frozen --all-groups

      - name: Sync frozen production environment for isolation proof
        working-directory: workspaces/decision-platform/python-services
        run: uv sync --frozen

      - name: Assert CPU x64 runtime
        working-directory: workspaces/decision-platform/research/s1-4r-jax-risk
        run: |
          uv run --frozen python - <<'PY'
          import jax
          import numpy as np

          assert jax.default_backend() == "cpu"
          assert jax.devices()
          assert all(device.platform == "cpu" for device in jax.devices())
          assert jax.config.jax_enable_x64 is True
          assert np.dtype(jax.numpy.asarray(1.0, dtype=jax.numpy.float64).dtype) == np.dtype(
              np.float64
          )
          PY

      - name: Run Ruff
        working-directory: workspaces/decision-platform/research/s1-4r-jax-risk
        run: uv run --frozen ruff check .

      - name: Run mypy
        working-directory: workspaces/decision-platform/research/s1-4r-jax-risk
        run: uv run --frozen mypy src benchmarks

      - name: Run correctness, parity, benchmark-contract, and isolation tests
        working-directory: workspaces/decision-platform/research/s1-4r-jax-risk
        run: uv run --frozen pytest -q

  oci-correctness:
    name: OCI CPU x64 correctness
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Build digest-pinned research image
        working-directory: workspaces/decision-platform/research/s1-4r-jax-risk
        run: docker build --tag s1-4r-risk-research:correctness --file Containerfile .

      - name: Run OCI correctness without network
        run: |
          docker run --rm --network none \
            --env JAX_PLATFORMS=cpu \
            --env JAX_ENABLE_X64=1 \
            --env S1_4R_EXECUTION_BOUNDARY=oci \
            s1-4r-risk-research:correctness \
            /app/.venv/bin/pytest -q

      - name: Record image identity
        run: |
          docker image inspect s1-4r-risk-research:correctness \
            --format 'image_id={{.Id}} size_bytes={{.Size}}'
