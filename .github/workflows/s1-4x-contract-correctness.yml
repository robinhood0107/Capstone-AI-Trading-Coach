name: S1.4X Gate 1 Contract Correctness

on:
  pull_request:
    branches: [main]
    paths:
      - "workspaces/decision-platform/research/s1-4x-numeric-parity/**"
      - "workspaces/decision-platform/python-services/pyproject.toml"
      - "workspaces/decision-platform/python-services/uv.lock"
      - "workspaces/decision-platform/python-services/app/financial_engineering/**"
      - "workspaces/decision-platform/python-services/tests/financial_engineering/**"
      - "workspaces/decision-platform/python-services/tests/test_s1_6_amendment_contract.py"
      - "workspaces/decision-platform/research/s1-4r-jax-risk/README.md"
      - "workspaces/decision-platform/research/s1-4r-jax-risk/pyproject.toml"
      - "workspaces/decision-platform/research/s1-4r-jax-risk/uv.lock"
      - "workspaces/decision-platform/research/s1-4r-jax-risk/src/**"
      - "workspaces/decision-platform/research/s1-4r-jax-risk/tests/**"
      - "shared-docs/metrics_definitions.md"
      - "docs/adr/ADR-027-s1-4x-isolated-numeric-parity.md"
      - ".gitignore"
      - ".github/workflows/s1-4x-contract-correctness.yml"

permissions:
  contents: read

concurrency:
  group: s1-4x-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON: "3.12.13"
  JAX_PLATFORMS: cpu
  JAX_ENABLE_X64: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"

jobs:
  neutral-contract-correctness:
    if: github.event.pull_request.head.ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository
    name: Neutral contract, oracle, and frozen regressions
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout full history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Establish runner-local reproducibility roots
        run: |
          S1_4X_RUNTIME="${RUNNER_TEMP}/s1-4x"
          mkdir -p "$S1_4X_RUNTIME/tmp" "$S1_4X_RUNTIME/uv"
          {
            echo "TMPDIR=$S1_4X_RUNTIME/tmp"
            echo "TEMP=$S1_4X_RUNTIME/tmp"
            echo "TMP=$S1_4X_RUNTIME/tmp"
            echo "UV_CACHE_DIR=$S1_4X_RUNTIME/uv"
          } >> "$GITHUB_ENV"

      - name: Install frozen uv and Python
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: "0.11.26"
          python-version: "3.12.13"

      - name: Assert neutral Linux CPU x64 runner
        run: |
          test "$(uname -s)" = "Linux"
          test "$(uname -m)" = "x86_64"
          test "$(getconf _NPROCESSORS_ONLN)" -ge 1

      - name: Assert approved reference amendment provenance
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          S1_4X=workspaces/decision-platform/research/s1-4x-numeric-parity
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              DIFF_BASE="$PR_BASE_SHA"
              ;;
            push)
              DIFF_BASE="$PUSH_BEFORE_SHA"
              ;;
            *)
              echo "unsupported provenance event: $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac
          if [[ -z "$DIFF_BASE" || "$DIFF_BASE" =~ ^0{40}$ ]]; then
            echo "provenance diff base is unavailable" >&2
            exit 1
          fi
          git cat-file -e "${DIFF_BASE}^{commit}"

          REFERENCE_BASE="$(
            python3 - <<'PY'
          import json
          from pathlib import Path

          lock = json.loads(Path(
              "workspaces/decision-platform/research/s1-4x-numeric-parity/"
              "contract/reference-lock.v1.json"
          ).read_text(encoding="utf-8"))
          print(lock["referenceBaseCommit"])
          PY
          )"
          # The historical commit is no longer served by the remote. Preserve
          # the original identity and exact reference bytes in-tree instead of
          # requiring an unavailable Git object or relaxing the reference.
          test "$REFERENCE_BASE" = bf8472dfcc5f9d883ca83bd461a62f254332b39f
          test "$(sha256sum "$S1_4X/contract/reference-lock.v1.json" | cut -d' ' -f1)" = \
            "d267c084592c14e6ab167e9a9afd370e45f1caf9a0959b7927b0d4a806fc5581"
          test "$(sha256sum contracts/fixtures/s1-4x-reference-runtime/pyproject.toml | cut -d' ' -f1)" = \
            "fd114bcabb230368d45142ffe7c68a47ea2ce860021d00abaeaf334d37f928eb"
          test "$(sha256sum contracts/fixtures/s1-4x-reference-runtime/uv.lock | cut -d' ' -f1)" = \
            "8cb06fb15858ba9bec5f94951cb89ece38d2ddfe13292d9a82df78f042393459"
          # Current production dependencies may evolve only with a reviewed
          # full-file pin and an unchanged numerical runtime below.
          test "$(sha256sum workspaces/decision-platform/python-services/pyproject.toml | cut -d' ' -f1)" = \
            "8f61ef42ecb6a47895e9c42d1cccb8a1553b8434026f6de628f91d1ca3a89ecd"
          test "$(sha256sum workspaces/decision-platform/python-services/uv.lock | cut -d' ' -f1)" = \
            "49bce736ce88afa34fe6f446189b119c61850237573ce57916303840cb2f1c2a"
          # MARS dependency updates did not change the frozen production
          # numeric runtime. Keep this assertion next to the full lock pin.
          python3 - <<'PY'
          import tomllib
          from pathlib import Path

          lock = tomllib.loads(Path(
              "workspaces/decision-platform/python-services/uv.lock"
          ).read_text(encoding="utf-8"))
          packages = {entry["name"]: entry["version"] for entry in lock["package"]}
          assert packages["numpy"] == "2.5.1"
          assert packages["scipy"] == "1.18.0"
          PY

          # 로컬 자료 경로에 결합된 obsolete host-only 검사는 한 번만 exact hash 전이로 제거한다.
          S1_4R_ISOLATION_TEST=workspaces/decision-platform/research/s1-4r-jax-risk/tests/test_production_isolation.py
          if ! git diff --quiet "$DIFF_BASE" HEAD -- "$S1_4R_ISOLATION_TEST"; then
            BASE_ISOLATION_SHA="$(
              git show "${DIFF_BASE}:${S1_4R_ISOLATION_TEST}" | sha256sum | cut -d' ' -f1
            )"
            HEAD_ISOLATION_SHA="$(sha256sum "$S1_4R_ISOLATION_TEST" | cut -d' ' -f1)"
            test "$BASE_ISOLATION_SHA" = \
              "daca84be569df6358ac84e171825b91f9610dfdabe99fb5f0ecab4f02b47c3cc"
            test "$HEAD_ISOLATION_SHA" = \
              "fa3b83093028f23166d3c6ad8ba8976008f96e74982671ed7282d71a756331af"
          fi

          # 고정 snapshot의 실제 테스트 수 변경은 해당 workflow assertion과 exact hash로 묶는다.
          S1_4X_BENCHMARK_CONTRACT_TEST="$S1_4X/benchmarks/tests/test_benchmark_contract.py"
          if ! git diff --quiet \
            "$DIFF_BASE" HEAD -- "$S1_4X_BENCHMARK_CONTRACT_TEST"; then
            BASE_BENCHMARK_CONTRACT_SHA="$(
              git show "${DIFF_BASE}:${S1_4X_BENCHMARK_CONTRACT_TEST}" \
                | sha256sum | cut -d' ' -f1
            )"
            HEAD_BENCHMARK_CONTRACT_SHA="$(
              sha256sum "$S1_4X_BENCHMARK_CONTRACT_TEST" | cut -d' ' -f1
            )"
            case "$BASE_BENCHMARK_CONTRACT_SHA:$HEAD_BENCHMARK_CONTRACT_SHA" in
              276637c89ec1e31e8a7682d3dbfcc224897c9381343fbeda243f298df5998707:b4daf347275761ff2a53e2096a4b6db5317bd5822a3fe7764809e10ea9abb4f4)
                ;;
              b4daf347275761ff2a53e2096a4b6db5317bd5822a3fe7764809e10ea9abb4f4:37e36e458d371432757bb40f81bd7fddc9a136e1760c230b6fd6197967e7e4dc)
                ;;
              *)
                echo "benchmark contract test transition is not approved" >&2
                exit 1
                ;;
            esac
          fi

          # S1.4 production 11함수의 실제 import boundary만 동결한다.
          # 같은 package에 추가되는 S6 모듈은 별도 계약/테스트를 가지며 S1.4X reference를 바꾸지 않는다.
          git diff --exit-code "$DIFF_BASE" HEAD -- \
            shared-docs/metrics_definitions.md \
            workspaces/decision-platform/python-services/app/financial_engineering/__init__.py \
            workspaces/decision-platform/python-services/app/financial_engineering/_validation.py \
            workspaces/decision-platform/python-services/app/financial_engineering/returns.py \
            workspaces/decision-platform/python-services/app/financial_engineering/risk_metrics.py \
            workspaces/decision-platform/python-services/tests/financial_engineering/test_returns.py \
            workspaces/decision-platform/python-services/tests/financial_engineering/test_risk_metrics.py \
            workspaces/decision-platform/research/s1-4r-jax-risk/src \
            workspaces/decision-platform/research/s1-4r-jax-risk/tests \
            ":(exclude)$S1_4R_ISOLATION_TEST" \
            "$S1_4X/contract" \
            ":(exclude)$S1_4X/contract/contract-manifest.v1.json" \
            ":(exclude)$S1_4X/contract/reference-lock.v1.json" \
            "$S1_4X/oracle" \
            ":(exclude)$S1_4X/oracle/tests/test_validate_contract.py" \
            "$S1_4X/benchmarks" \
            ":(exclude)$S1_4X/benchmarks/benchmark-plan.v1.json" \
            ":(exclude)$S1_4X/benchmarks/benchmark-plan.v1.sha256" \
            ":(exclude)$S1_4X_BENCHMARK_CONTRACT_TEST"

      - name: Check and sync frozen oracle environment
        run: |
          S1_4X=workspaces/decision-platform/research/s1-4x-numeric-parity
          uv lock --project "$S1_4X/oracle" --check
          uv sync --frozen --all-groups --project "$S1_4X/oracle"

      - name: Reproduce frozen fixtures, oracle, plan, and contract
        run: |
          S1_4X=workspaces/decision-platform/research/s1-4x-numeric-parity
          ORACLE="$S1_4X/oracle"
          uv run --frozen --project "$ORACLE" \
            python "$ORACLE/generate_large_fixtures.py" --check
          uv run --frozen --project "$ORACLE" \
            python "$ORACLE/capture_reference_results.py" --check
          uv run --frozen --project "$ORACLE" \
            python "$ORACLE/capture_reference_results.py" \
              --request "$S1_4X/contract/fixtures/invalid/semantic-errors.v1.json" \
              --output "$S1_4X/contract/fixtures/invalid/semantic-errors.expected.v1.json" \
              --check
          uv run --frozen --project "$ORACLE" \
            python "$S1_4X/benchmarks/render_benchmark_plan.py" --check
          uv run --frozen --project "$ORACLE" \
            python "$S1_4X/benchmarks/run_rotated_blocks.py" validate-plan

      - name: Run oracle and benchmark contract quality gates
        run: |
          S1_4X=workspaces/decision-platform/research/s1-4x-numeric-parity
          ORACLE="$S1_4X/oracle"
          (
            cd "$ORACLE"
            uv run --frozen ruff check . ../benchmarks
            uv run --frozen mypy . ../benchmarks
            # This frozen test describes the former push-to-main workflow and
            # unreachable Git carrier. The current promotion-only policy is
            # checked by contracts/tests/test_s14x_promotion_workflow.py.
            uv run --frozen pytest -q tests ../benchmarks/tests \
              -k 'not test_workflow_runs_both_triggers_and_accounts_for_262_snapshot_tests'
          )

      - name: Assert local artifact ignore boundary
        run: |
          S1_4X=workspaces/decision-platform/research/s1-4x-numeric-parity
          git check-ignore --no-index -q \
            "$S1_4X/contract/fixtures/large/generated/example.bin"
          git check-ignore --no-index -q "$S1_4X/scala/.scala-build/example"
          git check-ignore --no-index -q "$S1_4X/scala/.bsp/example"
          git check-ignore --no-index -q "$S1_4X/haskell/.stack-work/example"
          git check-ignore --no-index -q "$S1_4X/haskell/.stack-root/example"
          git check-ignore --no-index -q "$S1_4X/scala/.tool-bin/example"
          git check-ignore --no-index -q "$S1_4X/benchmarks/artifacts/example.json"
          for tracked in \
            "$S1_4X/contract/reference-lock.v1.json" \
            "$S1_4X/oracle/validate_contract.py" \
            "$S1_4X/benchmarks/benchmark-plan.v1.json"; do
            if git check-ignore --no-index -q "$tracked"; then
              echo "Tracked Gate 1 evidence is incorrectly ignored: $tracked" >&2
              exit 1
            fi
          done

      - name: Run current frozen production regression
        run: |
          PRODUCTION=workspaces/decision-platform/python-services
          (
            cd "$PRODUCTION"
            uv lock --check
            uv sync --frozen
            uv run --frozen ruff check .
            uv run --frozen mypy app
            uv run --frozen pytest -q
          )

      - name: Materialize the frozen reference bytes in an isolated repository
        id: reference-snapshot
        run: |
          S1_4X=workspaces/decision-platform/research/s1-4x-numeric-parity
          ORACLE="$S1_4X/oracle"
          SNAPSHOT="${RUNNER_TEMP}/s1-4x-reference-base"
          test ! -e "$SNAPSHOT"
          git clone --no-local --no-hardlinks "$GITHUB_WORKSPACE" "$SNAPSHOT"
          git -C "$SNAPSHOT" fetch --no-tags origin "$GITHUB_SHA"
          git -C "$SNAPSHOT" checkout --detach "$GITHUB_SHA"
          install -m 0644 contracts/fixtures/s1-4x-reference-runtime/pyproject.toml \
            "$SNAPSHOT/workspaces/decision-platform/python-services/pyproject.toml"
          install -m 0644 contracts/fixtures/s1-4x-reference-runtime/uv.lock \
            "$SNAPSHOT/workspaces/decision-platform/python-services/uv.lock"
          git -C "$SNAPSHOT" add \
            workspaces/decision-platform/python-services/pyproject.toml \
            workspaces/decision-platform/python-services/uv.lock
          git -C "$SNAPSHOT" -c user.name=reference-snapshot \
            -c user.email=reference-snapshot@invalid.example \
            commit -m 'Materialize frozen S1.4X runtime bytes'
          git -C "$SNAPSHOT" update-ref refs/remotes/origin/main HEAD
          test "$(git -C "$SNAPSHOT" rev-parse origin/main)" = \
            "$(git -C "$SNAPSHOT" rev-parse HEAD)"
          test -z "$(git -C "$SNAPSHOT" status --short --untracked-files=all)"
          SNAPSHOT="$SNAPSHOT" PYTHONPATH="$ORACLE" \
            uv run --frozen --project "$ORACLE" python - <<'PY'
          import os
          from pathlib import Path

          from validate_contract import validate_reference_lock

          repo = Path(os.environ["SNAPSHOT"]).resolve(strict=True)
          contract = (
              Path.cwd()
              / "workspaces/decision-platform/research/s1-4x-numeric-parity/contract"
          )
          evidence = validate_reference_lock(repo, contract)
          assert evidence["sourceCount"] > 0
          assert evidence["sourceTreeCount"] == 4
          PY
          echo "snapshot=$SNAPSHOT" >> "$GITHUB_OUTPUT"

      - name: Sync and lint frozen S1.4R reference snapshot
        env:
          SNAPSHOT: ${{ steps.reference-snapshot.outputs.snapshot }}
        run: |
          PRODUCTION="$SNAPSHOT/workspaces/decision-platform/python-services"
          RESEARCH="$SNAPSHOT/workspaces/decision-platform/research/s1-4r-jax-risk"
          (
            cd "$PRODUCTION"
            uv lock --check
            uv sync --frozen
          )
          (
            cd "$RESEARCH"
            uv lock --check
            uv sync --frozen --all-groups
            uv run --frozen ruff check .
            uv run --frozen mypy src benchmarks
          )

      - name: Run and account for all 262 frozen S1.4R tests
        env:
          SNAPSHOT: ${{ steps.reference-snapshot.outputs.snapshot }}
        run: |
          RESEARCH="$SNAPSHOT/workspaces/decision-platform/research/s1-4r-jax-risk"
          JUNIT="${RUNNER_TEMP}/s1-4r-reference-262.xml"
          (
            cd "$RESEARCH"
            uv run --frozen pytest -q --junitxml="$JUNIT"
          )
          JUNIT="$JUNIT" python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          root = ET.parse(os.environ["JUNIT"]).getroot()
          suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
          assert suites, f"JUnit report has no testsuite elements: root={root.tag}"
          tests = sum(int(suite.attrib["tests"]) for suite in suites)
          failures = sum(int(suite.attrib.get("failures", "0")) for suite in suites)
          errors = sum(int(suite.attrib.get("errors", "0")) for suite in suites)
          skipped = sum(int(suite.attrib.get("skipped", "0")) for suite in suites)
          assert tests == 262, f"expected 262 frozen S1.4R tests, got {tests}"
          assert failures == 0 and errors == 0 and skipped == 0
          print("S1.4R_REFERENCE_REGRESSION_PASS tests=262 failures=0 errors=0 skipped=0")
          PY
          echo "S1.4R reference snapshot: 262/262 tests passed." \
            >> "$GITHUB_STEP_SUMMARY"
