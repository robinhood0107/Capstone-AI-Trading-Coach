name: capstone-p1-full-app

services:
  bge-m3:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9@sha256:c26a226262ad4ff3330fb30b76653c1bb65da2fcf413b92284545a010e0a8a48
    platform: linux/amd64
    pull_policy: missing
    command:
      - --model-id
      - BAAI/bge-m3
      - --revision
      - 5617a9f61b028005a4858fdac845db406aefb181
      - --port
      - "80"
      - --max-client-batch-size
      - "64"
      - --max-batch-tokens
      - "8192"
    volumes:
      - p1-bge-model-cache:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 6g
    cpus: 4.0
    tmpfs:
      - /tmp:size=128m,mode=1777
    restart: on-failure:3
    networks: [p1-internal, p1-model-fetch]

  paddleocr-vl:
    image: ghcr.io/ggml-org/llama.cpp:server-b10524@sha256:d88f41f7675f8b30d7213a917f72a48f05d0549af4d1be7e712ebb130a235415
    platform: linux/amd64
    pull_policy: missing
    environment:
      LLAMA_CACHE: /models
      LLAMA_ARG_MODEL_URL: https://huggingface.co/PaddlePaddle/PaddleOCR-VL-1.6-GGUF/resolve/511b09642bb324401f15f97cc23bc67e8f0a291d/PaddleOCR-VL-1.6-GGUF.gguf?download=true
      LLAMA_ARG_MMPROJ_URL: https://huggingface.co/PaddlePaddle/PaddleOCR-VL-1.6-GGUF/resolve/511b09642bb324401f15f97cc23bc67e8f0a291d/PaddleOCR-VL-1.6-GGUF-mmproj.gguf?download=true
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: "8080"
      LLAMA_ARG_CTX_SIZE: "8192"
      LLAMA_ARG_N_PARALLEL: "1"
      LLAMA_ARG_ENDPOINT_METRICS: "1"
    command: ["--temp", "0"]
    volumes:
      - p1-paddleocr-model-cache:/models
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 6g
    cpus: 4.0
    tmpfs:
      - /tmp:size=128m,mode=1777
    restart: on-failure:3
    networks: [p1-internal, p1-model-fetch]

networks:
  p1-internal:
    internal: true
  # No host port is published. This bridge exists only so the official runtimes can fill their
  # named-volume caches from the exact Hugging Face revisions on first start.
  p1-model-fetch: {}

volumes:
  p1-bge-model-cache: {}
  p1-paddleocr-model-cache: {}
