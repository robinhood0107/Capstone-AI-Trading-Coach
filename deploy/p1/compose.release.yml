# 생성 파일이다. 손으로 고치지 않는다.
#
# 만드는 법:  python3 deploy/p1/generate_release_compose.py
# 확인하는 법: python3 deploy/p1/generate_release_compose.py --check
#
# 개발용 compose.yml 에서 build 지시자와 이미지에 구운 정적 바인드만 덜어낸 것이다.
# 소스 트리 없이 이미지와 비밀값 파일만으로 띄우는 용도다.
#
#   docker compose -f compose.release.yml --env-file release.env up -d --wait
#
# 운영자가 준비할 것은 두 가지뿐이다.
#   1. 이미지 (P1_SPRING_IMAGE, P1_PYTHON_IMAGE, P1_POSTGRES_IMAGE, P1_REDIS_IMAGE,
#      P1_DASHBOARD_IMAGE)
#   2. 비밀값 파일 디렉터리 (P1_SECRETS_DIR)

name: capstone-p1-full-app
services:
  postgres:
    image: ${P1_POSTGRES_IMAGE:-capstone-postgres-pgvector:p1-local}
    platform: linux/amd64
    user: 70:70
    group_add:
      - ${P1_SECRET_GID}
    entrypoint:
      - /usr/local/bin/p1-secret-entrypoint
      - postgres
      - docker-entrypoint.sh
    command:
      - postgres
      - -c
      - listen_addresses=*
      - -c
      - log_statement=none
    environment:
      POSTGRES_DB: capstone_p1
      POSTGRES_USER: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets:
      - postgres_env
    volumes:
      - p1-postgres-current:/var/lib/postgresql/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.5
    shm_size: 128m
    tmpfs:
      - /tmp:size=64m,mode=1777,uid=70,gid=70
      - /var/run/postgresql:size=16m,mode=0770,uid=70,gid=70
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d capstone_p1
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks:
      - p1-data
  redis:
    image: ${P1_REDIS_IMAGE:-capstone-redis:p1-local}
    platform: linux/amd64
    user: 999:1000
    group_add:
      - ${P1_SECRET_GID}
    entrypoint:
      - /usr/local/bin/p1-secret-entrypoint
      - redis
    secrets:
      - redis_env
    volumes:
      - p1-redis:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    tmpfs:
      - /tmp:size=16m,mode=1777,uid=999,gid=999
    healthcheck:
      test:
        - CMD-SHELL
        - . /run/secrets/redis_env && [ "$$(REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli --no-auth-warning
          ping)" = PONG ]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks:
      - p1-data
  rag-runtime-seed:
    image: ${P1_PYTHON_IMAGE:-capstone-decision-platform:p1-local}
    platform: linux/amd64
    user: 0:0
    entrypoint:
      - /usr/local/bin/p1-rag-runtime-seed
    environment:
      RAG_V2_VERTEX_AUTO_ACTIVATION_ENABLED: ${P1_RAG_V2_VERTEX_AUTO_ACTIVATION_ENABLED:-false}
      MARS_VERTEX_SERVICE_ACCOUNT_JSON_B64: ${MARS_VERTEX_SERVICE_ACCOUNT_JSON_B64:-}
      MARS_VERTEX_MODEL_ID: ${MARS_VERTEX_MODEL_ID:-gemini-3.5-flash}
      MARS_VERTEX_PROJECT_ID: ${MARS_VERTEX_PROJECT_ID:-}
      P1_VERTEX_OPERATOR: ${P1_VERTEX_OPERATOR:-auto-activation}
      P1_VERTEX_INPUT_TOKEN_CAP: ${P1_VERTEX_INPUT_TOKEN_CAP:-60512}
      P1_VERTEX_OUTPUT_TOKEN_CAP: ${P1_VERTEX_OUTPUT_TOKEN_CAP:-8192}
      P1_VERTEX_INPUT_BYTE_CAP: ${P1_VERTEX_INPUT_BYTE_CAP:-60000}
      P1_VERTEX_COST_CAP_MICROUSD: ${P1_VERTEX_COST_CAP_MICROUSD:-500000}
      P1_VERTEX_INPUT_MICROUSD_PER_TOKEN: ${P1_VERTEX_INPUT_MICROUSD_PER_TOKEN:-3}
      P1_VERTEX_OUTPUT_MICROUSD_PER_TOKEN: ${P1_VERTEX_OUTPUT_MICROUSD_PER_TOKEN:-17}
    volumes:
      - ${P1_RAG_RUNTIME_DIR:-p1-rag-runtime}:/run/rag-runtime
    restart: 'no'
    networks:
      - p1-data
  role-bootstrap:
    platform: linux/amd64
    group_add: &id001
      - ${P1_SECRET_GID}
    mem_limit: 2g
    cpus: 2.0
    read_only: true
    cap_drop: &id002
      - ALL
    security_opt: &id003
      - no-new-privileges:true
    pids_limit: 256
    restart: 'no'
    tmpfs: &id004
      - /tmp:size=128m,mode=1777
    image: ${P1_SPRING_IMAGE:-capstone-decision-platform:p1-local}
    entrypoint:
      - /usr/local/bin/p1-secret-entrypoint
      - role-bootstrap
    command:
      - java
      - -Dloader.main=com.capstone.decision.infrastructure.security.P1DatabaseRoleBootstrap
      - -cp
      - /app/app.jar
      - org.springframework.boot.loader.launch.PropertiesLauncher
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_DB: capstone_p1
      P1_OFFLINE_DEMO: 'true'
    secrets:
      - role_bootstrap_env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - p1-data
  migrate:
    platform: linux/amd64
    group_add: *id001
    mem_limit: 2g
    cpus: 2.0
    read_only: true
    cap_drop: *id002
    security_opt: *id003
    pids_limit: 256
    restart: 'no'
    tmpfs: *id004
    image: ${P1_SPRING_IMAGE:-capstone-decision-platform:p1-local}
    entrypoint:
      - /usr/local/bin/p1-secret-entrypoint
      - migration
    command:
      - java
      - -Dloader.main=com.capstone.decision.infrastructure.security.P1FlywayMigrate
      - -cp
      - /app/app.jar
      - org.springframework.boot.loader.launch.PropertiesLauncher
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_DB: capstone_p1
      P1_OFFLINE_DEMO: 'true'
    secrets:
      - migration_env
    depends_on:
      role-bootstrap:
        condition: service_completed_successfully
      rag-runtime-seed:
        condition: service_completed_successfully
    networks:
      - p1-data
  seed-import:
    image: ${P1_PYTHON_IMAGE:-capstone-decision-platform:p1-local}
    platform: linux/amd64
    entrypoint:
      - /usr/local/bin/p1-secret-entrypoint
      - seed-import
    command:
      - python
      - -m
      - app.release.public_rag_seed_cli
      - import
      - --manifest
      - /opt/capstone/seed/public-rag/public-rag-seed.v1.manifest.json
    user: 65532:65532
    group_add:
      - ${P1_SECRET_GID}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 1g
    cpus: 1.0
    restart: 'no'
    tmpfs:
      - /tmp:size=128m,mode=1777
    secrets:
      - seed_import_env
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - p1-data
  identity-bootstrap:
    platform: linux/amd64
    group_add: *id001
    mem_limit: 2g
    cpus: 2.0
    read_only: true
    cap_drop: *id002
    security_opt: *id003
    pids_limit: 256
    restart: 'no'
    tmpfs: *id004
    image: ${P1_SPRING_IMAGE:-capstone-decision-platform:p1-local}
    entrypoint:
      - /usr/local/bin/p1-secret-entrypoint
      - bootstrap
    command:
      - java
      - -Dloader.main=com.capstone.decision.infrastructure.security.DemoIdentityBootstrap
      - -cp
      - /app/app.jar
      - org.springframework.boot.loader.launch.PropertiesLauncher
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_DB: capstone_p1
      P1_OFFLINE_DEMO: 'true'
    secrets:
      - bootstrap_env
    depends_on:
      seed-import:
        condition: service_completed_successfully
    networks:
      - p1-data
  team-b-seed-import:
    profiles:
      - owner
    image: ${P1_PYTHON_IMAGE:-capstone-decision-platform:p1-local}
    entrypoint:
      - /usr/local/bin/p1-secret-entrypoint
      - artifact-import
    command:
      - python
      - -m
      - app.p1_owner.importer
      - --bundle-root
      - /opt/capstone/seed/team-b
      - --archive-parent
      - /archive
      - --git-seed
    environment:
      P1_OPERATOR_UID: ${P1_OPERATOR_UID}
    user: ${P1_OPERATOR_UID}:${P1_SECRET_GID}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 1g
    cpus: 1.0
    tmpfs:
      - /tmp:size=64m,mode=1777
    secrets:
      - artifact_import_env
    volumes:
      - ${P1_ARTIFACT_ARCHIVE_DIR:-/nonexistent}:/archive
    depends_on:
      identity-bootstrap:
        condition: service_completed_successfully
    networks:
      - p1-data
    restart: 'no'
  owner-scenario-materializer:
    profiles:
      - owner
    image: ${P1_PYTHON_IMAGE:-capstone-decision-platform:p1-local}
    entrypoint:
      - /usr/local/bin/p1-secret-entrypoint
      - artifact-import
    command:
      - python
      - -m
      - app.p1_owner.scenario_materializer
      - --bundle-root
      - /opt/capstone/seed/team-b
    environment:
      PROVIDER_LIVE_CALLS_ENABLED: 'false'
      P1_OPERATOR_UID: ${P1_OPERATOR_UID}
    user: ${P1_OPERATOR_UID}:${P1_SECRET_GID}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 1g
    cpus: 1.0
    tmpfs:
      - /tmp:size=64m,mode=1777
    secrets:
      - artifact_import_env
    depends_on:
      team-b-seed-import:
        condition: service_completed_successfully
    networks:
      - p1-data
    restart: 'no'
  dashboard-preview-seed:
    platform: linux/amd64
    group_add: *id001
    mem_limit: 2g
    cpus: 2.0
    read_only: true
    cap_drop: *id002
    security_opt: *id003
    pids_limit: 256
    restart: 'no'
    tmpfs: *id004
    profiles:
      - preview
    image: ${P1_PYTHON_IMAGE:-capstone-decision-platform:p1-local}
    entrypoint:
      - /usr/local/bin/p1-secret-entrypoint
      - demo
    command:
      - python
      - -m
      - app.s8_demo.preview_dashboard_seed
      - --config
      - /opt/capstone/shared-docs/backtest_config.yaml
    environment:
      PROVIDER_LIVE_CALLS_ENABLED: 'false'
      KIS_OFFLINE: '1'
    secrets:
      - demo_env
    depends_on:
      identity-bootstrap:
        condition: service_completed_successfully
    networks:
      - p1-data
  actor-authority:
    platform: linux/amd64
    group_add: *id001
    mem_limit: 2g
    cpus: 2.0
    read_only: true
    cap_drop: *id002
    security_opt: *id003
    pids_limit: 256
    restart: unless-stopped
    tmpfs: *id004
    image: ${P1_SPRING_IMAGE:-capstone-decision-platform:p1-local}
    entrypoint:
      - /usr/local/bin/p1-secret-entrypoint
      - authority
    command:
      - java
      - -Dloader.main=com.capstone.decision.infrastructure.security.ActorCapabilityAuthorityMain
      - -cp
      - /app/app.jar
      - org.springframework.boot.loader.launch.PropertiesLauncher
    environment:
      ACTOR_CAPABILITY_AUTHORITY_HOST: 0.0.0.0
      ACTOR_CAPABILITY_AUTHORITY_PORT: '18081'
      ACTOR_IDENTITY_JDBC_URL: jdbc:postgresql://postgres:5432/capstone_p1
      ACTOR_CAPABILITY_TLS_KEY_STORE_PATH: /run/secrets/actor_server_p12
      ACTOR_CAPABILITY_TLS_CA_CERTIFICATE_PATH: /run/secrets/actor_tls_ca
    secrets:
      - actor_capability_authority_env
      - actor_server_p12
      - actor_tls_ca
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - java
        - -Dloader.main=com.capstone.decision.infrastructure.security.P1TcpHealthCheck
        - -cp
        - /app/app.jar
        - org.springframework.boot.loader.launch.PropertiesLauncher
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - p1-data
  decision-platform:
    platform: linux/amd64
    group_add: *id001
    mem_limit: 2g
    cpus: 2.0
    read_only: true
    cap_drop: *id002
    security_opt: *id003
    pids_limit: 256
    restart: unless-stopped
    tmpfs: *id004
    image: ${P1_SPRING_IMAGE:-capstone-decision-platform:p1-local}
    environment:
      DECISION_SOURCE_WRITER_OFFLINE_TARGET: local
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: '8080'
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      MARS_PUBLIC_SURFACE_MODE: ${MARS_PUBLIC_SURFACE_MODE:-LOCAL}
      MARS_PUBLIC_ORIGIN: ${MARS_PUBLIC_ORIGIN:-}
      GOOGLE_OIDC_REDIRECT_URI: ${MARS_PUBLIC_ORIGIN:-}/api/v1/auth/oidc/callback/google
      KAKAO_OAUTH_REDIRECT_URI: ${MARS_PUBLIC_ORIGIN:-}/api/v1/auth/oidc/callback/kakao
      SPRING_FLYWAY_ENABLED: 'false'
      ACTOR_CAPABILITY_TRANSPORT: http
      ACTOR_CAPABILITY_AUTHORITY_URL: https://actor-authority:18081/internal/actor-capabilities/issue
      ACTOR_CAPABILITY_TLS_KEY_STORE_PATH: /run/secrets/actor_client_p12
      ACTOR_CAPABILITY_TLS_CA_CERTIFICATE_PATH: /run/secrets/actor_tls_ca
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_DB: capstone_p1
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      ASYNC_ADAPTER: db
      ASYNC_POLLING_ENABLED: 'true'
      ASYNC_WORKER_ENABLED: 'true'
      ASYNC_WORKER_GRPC_BIND_ADDRESS: 127.0.0.1:50056
      ASYNC_WORKER_GRPC_TARGET: 127.0.0.1:50056
      RETURN_INFERENCE_GRPC_BIND_ADDRESS: 127.0.0.1:50057
      RETURN_INFERENCE_GRPC_TARGET: 127.0.0.1:50057
      RETURN_INFERENCE_BUNDLE_ROOT: /opt/capstone/seed/team-b
      RETURN_INFERENCE_ALLOW_SYNTHETIC: 'false'
      RAG_ANSWERER: FIXTURE_ONLY
      RAG_GRPC_ENABLED: 'false'
      RAG_V2_GRPC_ENABLED: ${P1_RAG_V2_ENABLED:-false}
      RAG_V2_GRPC_TARGET: 127.0.0.1:50054
      RAG_V2_GRPC_BIND_ADDRESS: 127.0.0.1:50054
      RAG_V2_GRPC_ENABLE_REFLECTION: 'false'
      S4_9_RUNTIME_VOYAGE_QUERY_ENABLED: ${P1_RAG_V2_ENABLED:-false}
      S4_9_VOYAGE_TOKENIZER_SHA256: ${P1_RAG_V2_TOKENIZER_SHA256:-c0382117ea329cdf097041132f6d735924b697924d6f6fc3945713e96ce87539}
      P1_RAG_RUNTIME_DIR_MOUNT: /run/rag-runtime
      CAPSTONE_RAG_LOCAL_ROOT: /run/rag-runtime
      RAG_V2_VERTEX_AUTO_ACTIVATION_POLICY_FILE: /run/rag-runtime/control/pre-s5-vertex-auto-activation-policy.json
      RAG_V2_VERTEX_ENABLED: ${P1_RAG_V2_VERTEX_ENABLED:-false}
      VERTEX_MODEL_ID: ${MARS_VERTEX_MODEL_ID:-gemini-3.5-flash}
      MARS_VERTEX_SERVICE_ACCOUNT_JSON_B64: ${MARS_VERTEX_SERVICE_ACCOUNT_JSON_B64:-}
      RAG_LLM_MAX_OUTPUT_TOKENS: ${RAG_LLM_MAX_OUTPUT_TOKENS:-4096}
      P1_VERTEX_INPUT_MICROUSD_PER_TOKEN: ${P1_VERTEX_INPUT_MICROUSD_PER_TOKEN:-3}
      P1_VERTEX_OUTPUT_MICROUSD_PER_TOKEN: ${P1_VERTEX_OUTPUT_MICROUSD_PER_TOKEN:-17}
      P1_VERTEX_GROUNDING_MICROUSD_PER_QUERY: ${P1_VERTEX_GROUNDING_MICROUSD_PER_QUERY:-14000}
      RAG_V2_VERTEX_HEAD_COMMIT: ${P1_RAG_V2_VERTEX_HEAD_COMMIT:-}
      RAG_V2_VERTEX_TREE_DIGEST: ${P1_RAG_V2_VERTEX_TREE_DIGEST:-}
      RAG_V2_VERTEX_CI_DIGEST: ${P1_RAG_V2_VERTEX_CI_DIGEST:-}
      RAG_V2_VERTEX_SECURITY_DIGEST: ${P1_RAG_V2_VERTEX_SECURITY_DIGEST:-}
      RAG_V2_VERTEX_AUTO_ACTIVATION_ENABLED: ${P1_RAG_V2_VERTEX_AUTO_ACTIVATION_ENABLED:-false}
      RAG_WEB_ENABLED: 'false'
      S4_9_STRONG_LLM_ENABLED: ${P1_STRONG_LLM_ENABLED:-false}
      RAG_WEB_GOOGLE_BILLING_ACCOUNT_FINGERPRINT: ${P1_GOOGLE_BILLING_ACCOUNT_FINGERPRINT:-}
      STRONG_LLM_GRPC_BIND_ADDRESS: 127.0.0.1:50055
      STRONG_LLM_GRPC_TARGET: 127.0.0.1:50055
      STRONG_LLM_PROVIDER: ${P1_STRONG_LLM_PROVIDER:-vertex}
      STRONG_LLM_FALLBACK_PROVIDER: ${P1_STRONG_LLM_FALLBACK_PROVIDER:-}
      S4_9_MCP_ENABLED: 'false'
      P1_OFFLINE_DEMO: 'true'
      P1_TEAM_A_ACCEPTANCE_ENABLED: ${P1_TEAM_A_ACCEPTANCE_ENABLED:-false}
      P1_TEAM_A_ACCEPTANCE_FIXED_CLOCK: ${P1_TEAM_A_ACCEPTANCE_FIXED_CLOCK:-}
      APP_P1_RETURN_ARTIFACT_SYNTHETIC_TEST_PROFILE: ${P1_ARTIFACT_SYNTHETIC_TEST_PROFILE:-false}
      BROKERAGE_TICK_TABLE_VERIFICATION: ${P1_BROKERAGE_TICK_TABLE_VERIFICATION:-KRX_CASH_EQUITY_202312_ETP_UPDATE}
      BROKERAGE_GRPC_ENABLED: ${P1_KIS_MOCK_ONLINE_ENABLED:-false}
      BROKERAGE_GRPC_TARGET: 127.0.0.1:50052
      PYTHON_BROKERAGE_GRPC_BIND_ADDRESS: 127.0.0.1:50052
      FINANCIAL_ENGINEERING_GRPC_ENABLED: 'false'
      KIS_MODE: mock
      PROVIDER_LIVE_CALLS_ENABLED: 'false'
      KIS_OFFLINE: ${P1_KIS_OFFLINE:-1}
      KIS_MOCK_BROKERAGE_ONLINE_ENABLED: ${P1_KIS_MOCK_ONLINE_ENABLED:-false}
      P1_AUTOMATION_RUNTIME_ENABLED: ${P1_AUTOMATION_RUNTIME_ENABLED:-false}
      WORLD_NEWS_RETENTION_ENABLED: ${WORLD_NEWS_RETENTION_ENABLED:-false}
      P1_AUTOMATION_EVIDENCE_FIXTURE_ENABLED: 'false'
      DEBUG: ${P1_SPRING_DEBUG:-false}
    secrets:
      - spring_env
      - python_env
      - kis_mock_env
      - return_inference_env
      - automation_runtime_env
      - automation_observation_env
      - rag_v2_env
      - rag_history_kek
      - actor_client_p12
      - actor_tls_ca
    volumes:
      - ${P1_RAG_RUNTIME_DIR:-p1-rag-runtime}:/run/rag-runtime
    ports:
      - 127.0.0.1:${P1_API_PORT:-18080}:8080
    depends_on:
      actor-authority:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed-import:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - /app/decision-platform-health.py
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    networks:
      - p1-data
      - p1-app
      - p1-model
  synthetic-async-smoke:
    platform: linux/amd64
    group_add: *id001
    mem_limit: 2g
    cpus: 2.0
    read_only: true
    cap_drop: *id002
    security_opt: *id003
    pids_limit: 256
    restart: 'no'
    tmpfs: *id004
    profiles:
      - smoke
    image: ${P1_PYTHON_IMAGE:-capstone-decision-platform:p1-local}
    pull_policy: missing
    entrypoint:
      - /usr/local/bin/p1-secret-entrypoint
      - demo
    command:
      - python
      - -m
      - app.s8_demo.container_async_smoke
    environment:
      P1_SMOKE_MODE: DB
      PROVIDER_LIVE_CALLS_ENABLED: 'false'
      KIS_OFFLINE: '1'
    secrets:
      - demo_env
    networks:
      - p1-data
  artifact-importer:
    profiles:
      - owner
    image: ${P1_PYTHON_IMAGE:-capstone-decision-platform:p1-local}
    pull_policy: missing
    entrypoint:
      - /usr/local/bin/p1-secret-entrypoint
      - artifact-import
    command:
      - python
      - -m
      - app.p1_owner.importer
      - --bundle-root
      - /owner/${P1_ARTIFACT_BUNDLE_NAME:-disabled}
      - --manifest-sha256
      - ${P1_ARTIFACT_MANIFEST_SHA256:-disabled}
      - --archive-parent
      - /archive
    environment:
      P1_OPERATOR_UID: ${P1_OPERATOR_UID}
    user: ${P1_OPERATOR_UID}:${P1_SECRET_GID}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 1g
    cpus: 1.0
    tmpfs:
      - /tmp:size=64m,mode=1777
    secrets:
      - artifact_import_env
    volumes:
      - ${P1_ARTIFACT_BUNDLE_PARENT:-/nonexistent}:/owner:ro
      - ${P1_ARTIFACT_ARCHIVE_DIR:-/nonexistent}:/archive
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - p1-data
    restart: 'no'
  kis-mock-certification-runner:
    profiles:
      - owner
    image: ${P1_SPRING_IMAGE:-capstone-decision-platform:p1-local}
    platform: linux/amd64
    entrypoint:
      - /usr/local/bin/p1-secret-entrypoint
      - certification
