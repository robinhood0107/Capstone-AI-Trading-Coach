name: capstone-p1-full-app

x-app-security: &app-security
  platform: linux/amd64
  group_add: ["${P1_SECRET_GID}"]
  mem_limit: 2g
  cpus: 2.0
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 256
  restart: on-failure:3
  tmpfs:
    - /tmp:size=128m,mode=1777

services:
  postgres:
    image: ${P1_POSTGRES_IMAGE:-capstone-postgres-pgvector:p1-local}
    platform: linux/amd64
    user: "70:70"
    group_add: ["${P1_SECRET_GID}"]
    entrypoint: ["/opt/p1/secret-entrypoint", "postgres", "docker-entrypoint.sh"]
    command: ["postgres", "-c", "listen_addresses=*", "-c", "log_statement=none"]
    environment:
      POSTGRES_DB: capstone_p1
      POSTGRES_USER: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets: [postgres_env]
    volumes:
      # Keep the historical P1 volume recoverable. The current full-app schema
      # starts from a separately named volume so an older Flyway baseline can
      # never be silently reused by the preview path.
      - p1-postgres-current:/var/lib/postgresql/data
      - ../../infra/init/01-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
      - ../../infra/init/02-application-roles.sh:/docker-entrypoint-initdb.d/02-application-roles.sh:ro
      - ./docker/secret-entrypoint.sh:/opt/p1/secret-entrypoint:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.5
    shm_size: 128m
    tmpfs:
      - /tmp:size=64m,mode=1777,uid=70,gid=70
      - /var/run/postgresql:size=16m,mode=0770,uid=70,gid=70
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d capstone_p1"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: on-failure:3
    networks: [p1-data]

  redis:
    image: redis:7.2-alpine@sha256:dfa18828cbc07b3ae6a95ec7343f6c214fdee2d836197b4be8e9904420762cd8
    platform: linux/amd64
    user: "999:1000"
    group_add: ["${P1_SECRET_GID}"]
    entrypoint: ["/opt/p1/secret-entrypoint", "redis"]
    secrets: [redis_env]
    volumes:
      - p1-redis:/data
      - ./docker/secret-entrypoint.sh:/opt/p1/secret-entrypoint:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    tmpfs:
      - /tmp:size=16m,mode=1777,uid=999,gid=999
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          . /run/secrets/redis_env &&
          [ "$$(REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli --no-auth-warning ping)" = PONG ]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: on-failure:3
    networks: [p1-data]

  role-bootstrap:
    image: ${P1_SPRING_IMAGE:-capstone-decision-platform:p1-local}
    entrypoint: ["/usr/local/bin/p1-secret-entrypoint", "role-bootstrap"]
    command:
      - java
      - -Dloader.main=com.capstone.decision.infrastructure.security.P1DatabaseRoleBootstrap
      - -cp
      - /app/app.jar
      - org.springframework.boot.loader.launch.PropertiesLauncher
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: capstone_p1
      P1_OFFLINE_DEMO: "true"
    secrets: [role_bootstrap_env]
    depends_on:
      postgres: {condition: service_healthy}
    <<: *app-security
    restart: "no"
    networks: [p1-data]

  migrate:
    image: ${P1_SPRING_IMAGE:-capstone-decision-platform:p1-local}
    entrypoint: ["/usr/local/bin/p1-secret-entrypoint", "migration"]
    command:
      - java
      - -Dloader.main=com.capstone.decision.infrastructure.security.P1FlywayMigrate
      - -cp
      - /app/app.jar
      - org.springframework.boot.loader.launch.PropertiesLauncher
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: capstone_p1
      P1_OFFLINE_DEMO: "true"
    secrets: [migration_env]
    depends_on:
      role-bootstrap: {condition: service_completed_successfully}
    <<: *app-security
    restart: "no"
    networks: [p1-data]

  seed-import:
    image: ${P1_PYTHON_IMAGE:-capstone-decision-platform:p1-local}
    platform: linux/amd64
    entrypoint: ["/usr/local/bin/p1-secret-entrypoint", "seed-import"]
    command:
      - python
      - -m
      - app.release.public_rag_seed_cli
      - import
      - --manifest
      - /opt/capstone/public-rag-seed/public-rag-seed.v1.manifest.json
    user: "65532:65532"
    group_add: ["${P1_SECRET_GID}"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 1g
    cpus: 1.0
    restart: "no"
    tmpfs:
      - /tmp:size=128m,mode=1777
    secrets: [seed_import_env]
    volumes:
      - ./seed/public-rag:/opt/capstone/public-rag-seed:ro
      - ./docker/secret-entrypoint.sh:/usr/local/bin/p1-secret-entrypoint:ro
    depends_on:
      migrate: {condition: service_completed_successfully}
    networks: [p1-data]

  identity-bootstrap:
    image: ${P1_SPRING_IMAGE:-capstone-decision-platform:p1-local}
    entrypoint: ["/usr/local/bin/p1-secret-entrypoint", "bootstrap"]
    command:
      - java
      - -Dloader.main=com.capstone.decision.infrastructure.security.DemoIdentityBootstrap
      - -cp
      - /app/app.jar
      - org.springframework.boot.loader.launch.PropertiesLauncher
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: capstone_p1
      P1_OFFLINE_DEMO: "true"
    secrets: [bootstrap_env]
    depends_on:
      seed-import: {condition: service_completed_successfully}
    <<: *app-security
    restart: "no"
    networks: [p1-data]

  dashboard-preview-seed:
    profiles: [preview]
    image: ${P1_PYTHON_IMAGE:-capstone-decision-platform:p1-local}
    entrypoint: ["/usr/local/bin/p1-secret-entrypoint", "demo"]
    command:
      - python
      - -m
      - app.s8_demo.preview_dashboard_seed
      - --config
      - /opt/capstone/shared-docs/backtest_config.yaml
    environment:
      PROVIDER_LIVE_CALLS_ENABLED: "false"
      KIS_OFFLINE: "1"
    secrets: [demo_env]
    volumes:
      - ../../shared-docs/backtest_config.yaml:/opt/capstone/shared-docs/backtest_config.yaml:ro
    depends_on:
      identity-bootstrap: {condition: service_completed_successfully}
    <<: *app-security
    restart: "no"
    networks: [p1-data]

  actor-authority:
    image: ${P1_SPRING_IMAGE:-capstone-decision-platform:p1-local}
    entrypoint: ["/usr/local/bin/p1-secret-entrypoint", "authority"]
    command:
      - java
      - -Dloader.main=com.capstone.decision.infrastructure.security.ActorCapabilityAuthorityMain
      - -cp
      - /app/app.jar
      - org.springframework.boot.loader.launch.PropertiesLauncher
    environment:
      ACTOR_CAPABILITY_AUTHORITY_HOST: 0.0.0.0
      ACTOR_CAPABILITY_AUTHORITY_PORT: "18081"
      ACTOR_IDENTITY_JDBC_URL: jdbc:postgresql://postgres:5432/capstone_p1
      ACTOR_CAPABILITY_TLS_KEY_STORE_PATH: /run/secrets/actor_server_p12
      ACTOR_CAPABILITY_TLS_CA_CERTIFICATE_PATH: /run/secrets/actor_tls_ca
    secrets: [actor_capability_authority_env, actor_server_p12, actor_tls_ca]
    depends_on:
      postgres: {condition: service_healthy}
    <<: *app-security
    restart: on-failure:3
    healthcheck:
      test:
        - CMD
        - java
        - -Dloader.main=com.capstone.decision.infrastructure.security.P1TcpHealthCheck
        - -cp
        - /app/app.jar
        - org.springframework.boot.loader.launch.PropertiesLauncher
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [p1-data]

  decision-platform:
    image: ${P1_SPRING_IMAGE:-capstone-decision-platform:p1-local}
    build:
      context: ../..
      dockerfile: deploy/p1/docker/decision-platform.Dockerfile
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: "8080"
      SPRING_FLYWAY_ENABLED: "false"
      ACTOR_CAPABILITY_TRANSPORT: http
      ACTOR_CAPABILITY_AUTHORITY_URL: https://actor-authority:18081/internal/actor-capabilities/issue
      ACTOR_CAPABILITY_TLS_KEY_STORE_PATH: /run/secrets/actor_client_p12
      ACTOR_CAPABILITY_TLS_CA_CERTIFICATE_PATH: /run/secrets/actor_tls_ca
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: capstone_p1
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ASYNC_ADAPTER: db
      ASYNC_POLLING_ENABLED: "true"
      ASYNC_WORKER_ENABLED: "true"
      ASYNC_WORKER_GRPC_BIND_ADDRESS: 127.0.0.1:50056
      ASYNC_WORKER_GRPC_TARGET: 127.0.0.1:50056
      RETURN_INFERENCE_GRPC_BIND_ADDRESS: 127.0.0.1:50057
      RETURN_INFERENCE_ALLOW_SYNTHETIC: "false"
      RAG_ANSWERER: FIXTURE_ONLY
      RAG_GRPC_ENABLED: "false"
      RAG_V2_GRPC_ENABLED: "false"
      RAG_V2_VERTEX_ENABLED: "false"
      RAG_WEB_ENABLED: "false"
      S4_9_STRONG_LLM_ENABLED: "false"
      S4_9_MCP_ENABLED: "false"
      P1_OFFLINE_DEMO: "true"
      P1_TEAM_A_ACCEPTANCE_ENABLED: "${P1_TEAM_A_ACCEPTANCE_ENABLED:-false}"
      P1_TEAM_A_ACCEPTANCE_FIXED_CLOCK: "${P1_TEAM_A_ACCEPTANCE_FIXED_CLOCK:-}"
      APP_P1_RETURN_ARTIFACT_SYNTHETIC_TEST_PROFILE: "${P1_ARTIFACT_SYNTHETIC_TEST_PROFILE:-false}"
      BROKERAGE_GRPC_ENABLED: "${P1_KIS_MOCK_ONLINE_ENABLED:-false}"
      BROKERAGE_GRPC_TARGET: 127.0.0.1:50052
      PYTHON_BROKERAGE_GRPC_BIND_ADDRESS: 127.0.0.1:50052
      FINANCIAL_ENGINEERING_GRPC_ENABLED: "false"
      KIS_MODE: mock
      PROVIDER_LIVE_CALLS_ENABLED: "false"
      KIS_OFFLINE: "${P1_KIS_OFFLINE:-1}"
      KIS_MOCK_BROKERAGE_ONLINE_ENABLED: "${P1_KIS_MOCK_ONLINE_ENABLED:-false}"
      P1_AUTOMATION_RUNTIME_ENABLED: "${P1_AUTOMATION_RUNTIME_ENABLED:-false}"
    secrets: [spring_env, python_env, kis_mock_env, return_inference_env, automation_runtime_env, rag_history_kek, actor_client_p12, actor_tls_ca]
    ports:
      - "127.0.0.1:${P1_API_PORT:-18080}:8080"
    depends_on:
      actor-authority: {condition: service_healthy}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    <<: *app-security
    healthcheck:
      test:
        - CMD
        - python
        - /app/decision-platform-health.py
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    networks: [p1-data, p1-app, p1-model]

  synthetic-async-smoke:
    profiles: [smoke]
    image: ${P1_PYTHON_IMAGE:-capstone-decision-platform:p1-local}
    pull_policy: missing
    entrypoint: ["/usr/local/bin/p1-secret-entrypoint", "demo"]
    command: ["python", "-m", "app.s8_demo.container_async_smoke"]
    environment:
      P1_SMOKE_MODE: DB
      PROVIDER_LIVE_CALLS_ENABLED: "false"
      KIS_OFFLINE: "1"
    secrets: [demo_env]
    networks: [p1-data]
    <<: *app-security
    restart: "no"

  artifact-importer:
    profiles: [owner]
    image: ${P1_PYTHON_IMAGE:-capstone-decision-platform:p1-local}
    pull_policy: missing
    entrypoint: ["/usr/local/bin/p1-secret-entrypoint", "artifact-import"]
    command:
      - python
      - -m
      - app.p1_owner.importer
      - --bundle-root
      - /owner/${P1_ARTIFACT_BUNDLE_NAME:-disabled}
      - --manifest-sha256
      - ${P1_ARTIFACT_MANIFEST_SHA256:-disabled}
      - --archive-parent
      - /archive
    environment:
      P1_OPERATOR_UID: "${P1_OPERATOR_UID}"
    user: "${P1_OPERATOR_UID}:${P1_SECRET_GID}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 1g
    cpus: 1.0
    tmpfs:
      - /tmp:size=64m,mode=1777
    secrets: [artifact_import_env]
    volumes:
      - ${P1_ARTIFACT_BUNDLE_PARENT:-/nonexistent}:/owner:ro
      - ${P1_ARTIFACT_ARCHIVE_DIR:-/nonexistent}:/archive
      - ./docker/secret-entrypoint.sh:/usr/local/bin/p1-secret-entrypoint:ro
    depends_on:
      postgres: {condition: service_healthy}
    networks: [p1-data]
    restart: "no"

  kis-mock-certification-runner:
    profiles: [owner]
    image: ${P1_SPRING_IMAGE:-capstone-decision-platform:p1-local}
    platform: linux/amd64
    entrypoint: ["/usr/local/bin/p1-secret-entrypoint", "certification"]
    command: ["python", "-m", "app.brokerage.kis_mock_certification_cli", "run"]
    environment:
      P1_OPERATOR_UID: "${P1_OPERATOR_UID}"
      KIS_MODE: mock
      KIS_OFFLINE: "0"
      KIS_RETRY_ATTEMPTS: "1"
      KIS_REQUEST_INTERVAL_MILLISECONDS: "1000"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KIS_MOCK_APPROVAL_ENV_FILE: /run/secrets/kis_mock_env
    secrets:
      - spring_env
      - python_env
      - kis_mock_env
      - kis_mock_approval_private
      - kis_mock_approval_public
      - kis_mock_approval_trust_policy
      - p1_provider_claim_dsn
    volumes:
      - ${P1_KIS_MOCK_RUNTIME_DIR}:/certification
    user: "${P1_OPERATOR_UID}:${P1_SECRET_GID}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0
    tmpfs:
      - /tmp:size=64m,mode=1777
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: "no"
    # p1-data는 internal이라 egress가 없다. 인증 runner는 실제 KIS 모의 origin으로 나가야 하므로
    # redis 접근용 p1-data와 함께 egress가 있는 p1-app에도 붙는다.
    networks: [p1-data, p1-app]

  automation-runtime-cli:
    profiles: [owner]
    image: ${P1_PYTHON_IMAGE:-capstone-decision-platform:p1-local}
    platform: linux/amd64
    entrypoint: ["/usr/local/bin/p1-secret-entrypoint", "automation-cli"]
    command: ["python", "-m", "app.p1_owner.mock_automation_cli", "readiness"]
    environment:
      P1_LOCAL_CERTIFICATION_VALID: "${P1_LOCAL_CERTIFICATION_VALID:-false}"
      KIS_MOCK_BROKERAGE_ONLINE_ENABLED: "false"
    secrets: [automation_runtime_env, kis_mock_env]
    depends_on:
      postgres: {condition: service_healthy}
    <<: *app-security
    restart: "no"
    networks: [p1-data]

  automation-gate-author:
    profiles: [owner]
    image: ${P1_PYTHON_IMAGE:-capstone-decision-platform:p1-local}
    platform: linux/amd64
    entrypoint: ["/usr/local/bin/p1-secret-entrypoint", "automation-gate-author"]
    command: ["python", "-m", "app.p1_owner.automation_gate_author"]
    environment:
      P1_AUTOMATION_OWNER_USER_ID: "${P1_AUTOMATION_OWNER_USER_ID:-usr_demo_user}"
      P1_CERTIFICATION_RECEIPT_SHA256: "${P1_CERTIFICATION_RECEIPT_SHA256:-disabled}"
      P1_CERTIFICATION_SESSION_DATE: "${P1_CERTIFICATION_SESSION_DATE:-1970-01-01}"
      P1_RELEASE_BINDING_SHA256: "${P1_RELEASE_BINDING_SHA256:-disabled}"
      P1_SOURCE_BINDING_SHA256: "${P1_SOURCE_BINDING_SHA256:-disabled}"
    secrets: [automation_gate_author_env]
    depends_on:
      postgres: {condition: service_healthy}
    <<: *app-security
    restart: "no"
    networks: [p1-data]

  team-a-acceptance-seed:
    profiles: [acceptance]
    image: ${P1_PYTHON_IMAGE:-capstone-decision-platform:p1-local}
    platform: linux/amd64
    entrypoint: ["/usr/local/bin/p1-secret-entrypoint", "team-a-acceptance"]
    command: ["python", "-m", "app.p1_owner.team_a_acceptance_seed", "seed"]
    environment:
      P1_OFFLINE_DEMO: "true"
      P1_TEAM_A_ACCEPTANCE_FIXED_CLOCK: "${P1_TEAM_A_ACCEPTANCE_FIXED_CLOCK:-}"
    secrets: [team_a_acceptance_env]
    depends_on:
      postgres: {condition: service_healthy}
    <<: *app-security
    restart: "no"
    networks: [p1-data]

  bge-m3:
    profiles: [models]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9@sha256:c26a226262ad4ff3330fb30b76653c1bb65da2fcf413b92284545a010e0a8a48
    platform: linux/amd64
    pull_policy: missing
    command:
      - --model-id
      - BAAI/bge-m3
      - --revision
      - 5617a9f61b028005a4858fdac845db406aefb181
      - --port
      - "80"
      - --max-client-batch-size
      - "64"
      - --max-batch-tokens
      - "8192"
    volumes:
      - p1-bge-model-cache:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 10g
    cpus: 4.0
    tmpfs:
      - /tmp:size=128m,mode=1777
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:80/health"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
    restart: on-failure:3
    networks: [p1-model, p1-model-fetch]

  paddleocr-vl-model-fetch:
    profiles: [models]
    image: ghcr.io/ggml-org/llama.cpp:server-b10524@sha256:d88f41f7675f8b30d7213a917f72a48f05d0549af4d1be7e712ebb130a235415
    platform: linux/amd64
    pull_policy: missing
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        fetch() {
          url=$$1
          destination=$$2
          expected=$$3
          if [ -f "$$destination" ]; then
            printf '%s  %s\n' "$$expected" "$$destination" | sha256sum -c -
            return
          fi
          partial=$${destination}.part
          curl --fail --location --retry 0 --continue-at - --output "$$partial" "$$url"
          printf '%s  %s\n' "$$expected" "$$partial" | sha256sum -c -
          mv "$$partial" "$$destination"
        }
        fetch \
          'https://huggingface.co/PaddlePaddle/PaddleOCR-VL-1.6-GGUF/resolve/511b09642bb324401f15f97cc23bc67e8f0a291d/PaddleOCR-VL-1.6-GGUF.gguf?download=true' \
          /models/PaddleOCR-VL-1.6-GGUF.gguf \
          f3ae46ec885050acf4b3d31944431e1fd90d50664fb09126af4a3c050ba14ee8
        fetch \
          'https://huggingface.co/PaddlePaddle/PaddleOCR-VL-1.6-GGUF/resolve/511b09642bb324401f15f97cc23bc67e8f0a291d/PaddleOCR-VL-1.6-GGUF-mmproj.gguf?download=true' \
          /models/PaddleOCR-VL-1.6-GGUF-mmproj.gguf \
          204d757d7610d9b3faab10d506d69e5b244e32bf765e2bab2d0167e65e0a058a
    volumes:
      - p1-paddleocr-model-cache:/models
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
    tmpfs:
      - /tmp:size=32m,mode=1777
    restart: "no"
    networks: [p1-model-fetch]

  paddleocr-vl:
    profiles: [models]
    image: ghcr.io/ggml-org/llama.cpp:server-b10524@sha256:d88f41f7675f8b30d7213a917f72a48f05d0549af4d1be7e712ebb130a235415
    platform: linux/amd64
    pull_policy: missing
    environment:
      LLAMA_CACHE: /models
    command:
      - --model
      - /models/PaddleOCR-VL-1.6-GGUF.gguf
      - --mmproj
      - /models/PaddleOCR-VL-1.6-GGUF-mmproj.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "8192"
      - --parallel
      - "1"
      - --metrics
      - --temp
      - "0"
    volumes:
      - p1-paddleocr-model-cache:/models
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 6g
    cpus: 4.0
    tmpfs:
      - /tmp:size=128m,mode=1777
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
    restart: on-failure:3
    networks: [p1-model]

  return-engine-preview-prepare:
    profiles: [preview]
    image: capstone-return-engine-received-preview:p1-local
    build:
      context: ../../workspaces/return-engine
      dockerfile: Dockerfile
    command: ["python", "-m", "preview_cli", "prepare"]
    user: "65532:65532"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 3g
    cpus: 2.0
    tmpfs:
      - /tmp:size=128m,mode=1777
    volumes:
      - p1-return-preview:/output
    restart: "no"

  experience-dashboard:
    image: capstone-experience-dashboard:p1-local
    build:
      context: ../../workspaces/experience-dashboard
      dockerfile: Dockerfile
      args: {}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_MODE: live
      DECISION_PLATFORM_INTERNAL_URL: http://decision-platform:8080
      TEAM_B_PREVIEW_ARTIFACT: /artifacts/team-b/005930.KS.json
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    tmpfs:
      - /tmp:size=64m,mode=1777
    ports:
      - "127.0.0.1:${P1_DASHBOARD_PORT:-3000}:3000"
    volumes:
      - p1-return-preview:/artifacts/team-b:ro
    depends_on:
      decision-platform: {condition: service_healthy}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/healthz')
          .then(async response => { const body=await response.json(); if (!response.ok || body.status !== 'UP') process.exit(1); })
          .catch(() => process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: on-failure:3
    networks: [p1-app]

