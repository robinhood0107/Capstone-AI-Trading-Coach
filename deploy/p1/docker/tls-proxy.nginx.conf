# 서버에 올릴 때 평문 HTTP 를 밖으로 내보내지 않기 위한 종단점이다.
# 앱 포트(127.0.0.1)는 그대로 두고, 이 프록시만 바깥을 본다.

worker_processes  1;
error_log  /dev/stderr warn;
pid        /tmp/nginx.pid;

events { worker_connections 256; }

http {
  access_log  /dev/stdout;
  client_body_temp_path /tmp/client;
  proxy_temp_path       /tmp/proxy;
  fastcgi_temp_path     /tmp/fastcgi;
  uwsgi_temp_path       /tmp/uwsgi;
  scgi_temp_path        /tmp/scgi;

  # 업로드 본문은 앱의 상한과 같은 자리에서 막는다.
  client_max_body_size 1m;
  server_tokens off;

  # 평문으로 들어오면 돌려보낸다. 열어 두면 TLS 를 세운 의미가 없다.
  #
  # 이 리다이렉트는 **프록시가 표준 443 으로 공개된다**고 가정한다($host 는 포트를 뺀다).
  # $http_host 를 쓰면 클라이언트가 온 평문 포트가 그대로 붙어 https 를 평문 포트로
  # 되돌려보내게 되므로 쓰지 않는다. 비표준 포트로 공개한다면 여기를 그 포트로 적는다.
  server {
    listen 8080;
    return 308 https://$host$request_uri;
  }

  server {
    listen 8443 ssl;
    http2 on;

    ssl_certificate     /run/secrets/proxy_tls_certificate;
    ssl_certificate_key /run/secrets/proxy_tls_private_key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 10m;

    # HSTS 는 프록시가 유일한 입구일 때만 뜻이 있다. 여기가 그 자리다.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location /api/ {
      proxy_pass http://decision-platform:8080;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 120s;
    }

    location / {
      proxy_pass http://experience-dashboard:3000;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 120s;
    }
  }
}
