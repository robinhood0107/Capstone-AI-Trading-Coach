[project]
name = "decision-platform-services"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111", "uvicorn>=0.30",
  "grpcio>=1.64", "grpcio-health-checking>=1.64", "grpcio-reflection>=1.64", "protobuf>=4.25",
  "pydantic>=2.7", "pydantic-settings>=2.3",
  "httpx>=0.27", "tenacity>=8.3",
  "pandas>=2.2", "pyarrow>=16",
  "lightgbm>=4.3", "scikit-learn>=1.5", "hmmlearn>=0.3", "statsmodels>=0.14", "scipy>=1.13",
  "psycopg[binary]>=3.1", "pgvector>=0.2",
  "redis>=5.0", "confluent-kafka>=2.4",
  "FlagEmbedding>=1.2",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio", "ruff>=0.5", "mypy>=1.10", "grpcio-tools>=1.64"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
