[project]
name = "s1-4r-risk-research"
version = "0.1.0"
description = "Isolated S1.4R advanced-risk NumPy and JAX CPU/x64 research"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.5.1",
  "jax==0.11.0",
  "jaxlib==0.11.0",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "hypothesis==6.156.6",
  "jsonschema[format]==4.26.0",
  "mypy==2.2.0",
  "pyperf==2.10.0",
  "pytest==9.1.1",
  "ruff==0.15.20",
]

[tool.hatch.build.targets.wheel]
packages = ["src/s1_4r_risk_research"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "benchmarks"]

[[tool.mypy.overrides]]
module = ["jax.*"]
ignore_missing_imports = true
