[dependency-groups]
dev = [
  "mypy==2.2.0",
  "pytest==9.1.1",
  "ruff==0.15.20"
]

[project]
name = "s1-4x-numeric-parity-oracle"
version = "0.1.0"
description = "Frozen S1.4X contract, fixture, oracle, and host validators"
requires-python = "==3.12.13"
dependencies = [
  "jsonschema[format]==4.26.0",
  "numpy==2.5.1"
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["."]
mypy_path = ["../benchmarks"]
explicit_package_bases = true
exclude = ["(^|/)tests/conftest\\.py$"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.uv]
package = false
